stages:
  - prepare
  - quality
  - build_and_test # Build + Test en parallèle
  - deploy
  - smoke_test # Vérification post-déploiement
  - notify
  - cleanup

workflow:
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[skip ci\]/i
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  APP_IMAGE: $CI_REGISTRY_IMAGE/app
  IMAGE_TAG: $CI_COMMIT_REF_SLUG
  CI_IMAGE: $CI_REGISTRY_IMAGE/ci:$CI_COMMIT_REF_SLUG

default:
  tags:
    - self-hosted-shell
  interruptible: true
  before_script:
    # Centralisation de l'authentification Docker
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# --- ETAPE 0 : BUILD IMAGE CI (une seule fois) ---
# The CI image contains ONLY PHP extensions + Composer + installed vendor deps.
# It does NOT include the application code, so `composer install` is only
# re-run when composer.lock changes — not on every commit.
prepare_ci_image:
  stage: prepare
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - |
      # Only push the CI image to the registry on protected branches (main / preprod).
      # On feature branches we still BUILD the image locally so the quality jobs
      # (phpstan, pint, rector, composer_audit, test_suite) on the SAME self-hosted
      # runner can use it — but we skip the push to avoid polluting the registry
      # with one ~1.4 GB image per branch slug.
      #
      # Cache source: on feature branches we pull ci:main (stable base) instead of
      # a per-branch tag that doesn't exist, so the build still benefits from layer
      # caching.
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "preprod" ]; then
        CACHE_FROM=$CI_IMAGE
      else
        CACHE_FROM=$CI_REGISTRY_IMAGE/ci:main
      fi
      docker pull $CACHE_FROM || true
      docker build --cache-from $CACHE_FROM -t $CI_IMAGE -f - . <<'DOCKERFILE'
      FROM php:8.4-cli-alpine
      RUN apk add --no-cache bash git libzip-dev icu-dev postgresql-dev libpng-dev oniguruma-dev gettext-dev freetype-dev libjpeg-turbo-dev libwebp-dev $PHPIZE_DEPS \
        && docker-php-ext-configure gd --with-freetype --with-jpeg --with-webp \
        && docker-php-ext-install bcmath intl pdo_pgsql mbstring zip gd exif gettext \
        && pecl install redis && docker-php-ext-enable redis \
        && apk del $PHPIZE_DEPS && rm -rf /tmp/*
      COPY --from=composer:latest /usr/bin/composer /usr/bin/composer
      WORKDIR /app
      # Layer 1: install deps (cached until composer.lock changes)
      COPY composer.json composer.lock ./
      # `composer install` retry : codeload.github.com renvoie
      # ponctuellement des HTTP 400/5xx transitoires sur les dist
      # `legacy.zip`. 5 tentatives + backoff 15 s absorbent ces aléas
      # GitHub sans faire échouer tout le pipeline sur un blip réseau.
      RUN mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache \
        && touch .env \
        && for i in 1 2 3 4 5; do \
             composer install --no-interaction --no-ansi --no-scripts --prefer-dist -q && break; \
             echo "composer install a echoue, nouvelle tentative $i/5 dans 15s..."; \
             sleep 15; \
             [ "$i" = "5" ] && echo "composer install a echoue apres 5 tentatives" && exit 1; \
           done
      # Layer 2: copy code (fast, does not re-run composer install)
      COPY . .
      DOCKERFILE
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "preprod" ]; then
        docker push $CI_IMAGE || true
      else
        echo "ℹ️  Skipping registry push for feature branch '$CI_COMMIT_BRANCH' (image kept locally on runner)"
      fi
  retry:
    max: 2
    when: runner_system_failure
  rules:
    - if: $CI_COMMIT_BRANCH

# --- ETAPE 1 : QUALITY (tous en parallele) ---
phpstan:
  stage: quality
  needs: [prepare_ci_image]
  # On monte un cache `phpstan/` partagé entre exécutions sur le
  # runner. Le cache rend phpstan ~5× plus rapide quand seul un
  # sous-ensemble de fichiers PHP a changé : il ne ré-analyse que
  # les fichiers dont le hash a bougé.
  script:
    - mkdir -p /tmp/phpstan-cache-$CI_PROJECT_ID
    - docker run --rm
        -e APP_KEY="base64:$(openssl rand -base64 32)"
        -v "/tmp/phpstan-cache-$CI_PROJECT_ID:/tmp/phpstan"
        -e PHPSTAN_TMPDIR=/tmp/phpstan
        $CI_IMAGE ./vendor/bin/phpstan analyse --memory-limit=512M --no-progress
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - '**/*.php'
        - phpstan.neon
        - phpstan.neon.dist

style_check:
  stage: quality
  needs: [prepare_ci_image]
  script:
    - docker run --rm $CI_IMAGE ./vendor/bin/pint --test
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - '**/*.php'

composer_security:
  stage: quality
  needs: [prepare_ci_image]
  # `--locked` audite uniquement les versions verrouillées dans
  # `composer.lock` sans tenter de résoudre la fenêtre de dispatch
  # (~2× plus rapide). `--abandoned=ignore` ne fail pas sur les
  # paquets abandonnés (par ex. `doctrine/annotations`) — c'est un
  # signal de dette technique, pas une vulnérabilité.
  script:
    - docker run --rm $CI_IMAGE composer audit --locked --abandoned=ignore --no-cache
  rules:
    # Quand ni composer.json ni composer.lock ne changent, l'audit
    # ne peut RIEN trouver de neuf — skip pour économiser ~30 s par
    # pipeline branche feature.
    - if: $CI_COMMIT_BRANCH
      changes:
        - composer.json
        - composer.lock
    # Mais sur main/preprod on audite TOUJOURS (même un commit
    # docs-only) : un advisory peut apparaître sans changement de
    # lockfile entre nos pipelines.
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "preprod"

# Rector — automated refactor checks. Runs in --dry-run so it never modifies CI;
# fails the job if there are unapplied automatic upgrades / fixes that should be
# committed before merge.
rector:
  stage: quality
  needs: [prepare_ci_image]
  allow_failure: true # advisory in CI: do not block the pipeline (yet) — see AGENTS.md
  script:
    - docker run --rm $CI_IMAGE ./vendor/bin/rector process --dry-run --no-progress-bar
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - '**/*.php'
        - rector.php

sast:
  stage: quality
  needs: [prepare_ci_image]
  # Was `allow_failure: true` — the scan ran but never blocked. The
  # `--error` flag instructs Semgrep to exit non-zero on findings.
  script:
    - docker run --rm -v $(pwd):/src semgrep/semgrep semgrep --config=p/php --quiet --error /src
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - '**/*.php'
        - rector.php

# --- ETAPE 2 : BUILD & PUSH (en parallèle avec tests) ---
build_image:
  stage: build_and_test
  # A push that gets interrupted mid-`docker push` can leave a
  # partially-uploaded manifest under `:latest`. The next deploy
  # would then `docker compose pull` an incomplete image. The
  # global `interruptible: true` (line ~24) protects the test
  # suite (cancel-and-restart is fine there); the build must
  # complete or fail cleanly.
  interruptible: false
  variables:
    DOCKER_BUILDKIT: "1"
  needs:
    - job: phpstan
      optional: true
    - job: style_check
      optional: true
    - job: composer_security
  script:
    # Pull the previous image to use as a cache source — dramatically speeds up
    # builds when only code (not dependencies) changed.
    - docker pull $APP_IMAGE:latest || true
    - docker build --cache-from $APP_IMAGE:latest -t $APP_IMAGE:$IMAGE_TAG .
    - docker push $APP_IMAGE:$IMAGE_TAG
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag $APP_IMAGE:$IMAGE_TAG $APP_IMAGE:latest
        docker push $APP_IMAGE:latest
      fi
  after_script:
    - docker logout $CI_REGISTRY 2>/dev/null || true
  retry:
    max: 2
    when: runner_system_failure
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "preprod"

trivy_scan:
  stage: build_and_test
  needs: [build_image]
  # Was `allow_failure: true` AND `--exit-code 0` — the scan ran but
  # could never block. CRITICAL CVEs on the production image now fail
  # the pipeline. HIGH stays informational (logged, doesn't block) and
  # `--ignore-unfixed` skips advisories with no available patch.
  script:
    - docker run --rm
        -v /var/run/docker.sock:/var/run/docker.sock
        aquasec/trivy:latest image
        --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress
        $APP_IMAGE:$IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "preprod"

# --- ETAPE 2 : TESTS (en parallèle avec build) ---
#
# Timeout 20 min : la suite tourne ~10 min en séquentiel. Avec
# `--parallel --processes=4` on tombe sous 5 min, mais on garde la
# marge pour absorber le démarrage des conteneurs PG/Redis/Meili
# (~20 s de warmup) + la migration initiale (~10 s) + une éventuelle
# reprise de test flaky en sequential fallback.
test_suite:
  stage: build_and_test
  needs: [prepare_ci_image]
  timeout: 20 minutes
  retry:
    max: 2
    when: runner_system_failure
  script:
    - |
      # Create isolated network for this job
      docker network create ci-net-$CI_JOB_ID

      # Start PostgreSQL with PostGIS
      docker run -d \
        --name pg-$CI_JOB_ID \
        --network ci-net-$CI_JOB_ID \
        -e POSTGRES_DB=testing \
        -e POSTGRES_USER=gitlab \
        -e POSTGRES_PASSWORD=test_pass \
        postgis/postgis:15-3.3-alpine

      # Start Redis (cache + queue) — must run with the same image
      # version as prod so a Redis-feature regression fails CI rather
      # than slipping into release. The phpunit.xml still defaults
      # CACHE/QUEUE/SESSION to array/sync for stability, but tests
      # explicitly opting in via env can now hit a real Redis.
      docker run -d \
        --name redis-$CI_JOB_ID \
        --network ci-net-$CI_JOB_ID \
        redis:alpine

      # Start Meilisearch — same `v1.10` tag as prod. Was absent from
      # the GitLab pipeline, so any Scout/Meili regression slipped
      # through CI (the team specifically called out an
      # "ads in DB vs Meilisearch" drift bug in .env.example).
      docker run -d \
        --name meili-$CI_JOB_ID \
        --network ci-net-$CI_JOB_ID \
        -e MEILI_NO_ANALYTICS=true \
        -e MEILI_ENV=development \
        getmeili/meilisearch:v1.10

      # Wait until PostgreSQL accepts TCP connections (not just Unix socket).
      # pg_isready without -h checks /var/run/postgresql (Unix socket) which
      # becomes ready before TCP is bound — causing cross-container ECONNREFUSED.
      echo "Waiting for PostgreSQL..."
      for i in $(seq 1 30); do
        docker exec pg-$CI_JOB_ID pg_isready -U gitlab -h 127.0.0.1 -p 5432 && break
        [ "$i" = "30" ] && echo "PostgreSQL failed to start" && exit 1
        sleep 2
      done

      # PostGIS dans template1 : `php artisan test --parallel` cree une
      # base par worker via `CREATE DATABASE testing_test_N`, qui herite
      # de template1. L'image postgis n'active l'extension que dans la
      # base `testing` (POSTGRES_DB), donc les bases parallèles n'ont PAS
      # postgis → la migration `create_ad` (colonne geometry) casse sur
      # "type public.geometry does not exist". On l'active une fois dans
      # template1 pour que toutes les bases filles en heritent.
      echo "Enabling PostGIS in template1..."
      docker exec pg-$CI_JOB_ID psql -U gitlab -d template1 \
        -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      echo "Waiting for Redis..."
      for i in $(seq 1 15); do
        docker exec redis-$CI_JOB_ID redis-cli ping 2>/dev/null | grep -q PONG && break
        [ "$i" = "15" ] && echo "Redis failed to start" && exit 1
        sleep 1
      done

      echo "Waiting for Meilisearch..."
      for i in $(seq 1 20); do
        docker run --rm --network ci-net-$CI_JOB_ID curlimages/curl:latest \
          curl --silent --fail "http://meili-$CI_JOB_ID:7700/health" >/dev/null 2>&1 && break
        [ "$i" = "20" ] && echo "Meilisearch failed to start" && exit 1
        sleep 2
      done

      # Run test suite inside CI image.
      #
      # IMPORTANT : on passe le script via `bash -s` + heredoc
      # single-quoted (`<<'TEST_SCRIPT'`). Le précédent `sh -c '...'`
      # cassait sur la moindre apostrophe dans les commentaires
      # francais (les chaînes single-quoted shell ne supportent PAS
      # \' comme echappement — l'apostrophe FERME la chaîne et la
      # suite est ré-interprétée par le shell HÔTE gitlab-runner).
      # Conséquence du bug : `php artisan test` était exécuté sur
      # le runner (sans vendor/autoload.php) au lieu du container.
      docker run --rm \
        --network ci-net-$CI_JOB_ID \
        -e DB_CONNECTION=pgsql \
        -e DB_HOST=pg-$CI_JOB_ID \
        -e DB_PORT=5432 \
        -e DB_DATABASE=testing \
        -e DB_USERNAME=gitlab \
        -e DB_PASSWORD=test_pass \
        -e REDIS_HOST=redis-$CI_JOB_ID \
        -e REDIS_PORT=6379 \
        -e MEILISEARCH_HOST=http://meili-$CI_JOB_ID:7700 \
        -e MEILISEARCH_KEY= \
        -e SCOUT_DRIVER=null \
        -e MAIL_MAILER=array \
        -e RESEND_KEY= \
        -i \
        $CI_IMAGE bash -s <<'TEST_SCRIPT'
      set -e
      cp .env.example .env
      cp .env.example .env.testing
      rm -f database/data/cities.sql
      php artisan key:generate --env=testing
      php artisan migrate --env=testing --force
      echo "=== RUNNING TESTS (parallel, 4 processes, compact) ==="
      set +e
      # --parallel --processes=4 divise le wall-time par ~3 sur ce
      # repo (Pest fork-pool sur 4 workers ; chaque worker recoit son
      # propre schema testing_{N} cree a la volee par ParaTest).
      # --compact reduit le bruit pour rester sous la limite de 4 Mo
      # de log GitLab. Fallback sequentiel si Pest sort != 0 :
      # certains tests peuvent se concurrencer sur la cache locale.
      php artisan test --env=testing --parallel --processes=4 --compact 2>&1
      TEST_RC=$?
      if [ $TEST_RC -ne 0 ]; then
        echo "=== PARALLEL FAILED (RC=$TEST_RC) - RETRY SEQUENTIAL ==="
        php artisan test --env=testing --compact 2>&1
        TEST_RC=$?
      fi
      echo "=== TESTS FINISHED WITH RC=$TEST_RC ==="
      exit $TEST_RC
      TEST_SCRIPT
  after_script:
    - docker rm -f pg-$CI_JOB_ID 2>/dev/null || true
    - docker rm -f redis-$CI_JOB_ID 2>/dev/null || true
    - docker rm -f meili-$CI_JOB_ID 2>/dev/null || true
    - docker network rm ci-net-$CI_JOB_ID 2>/dev/null || true
  rules:
    - if: $CI_COMMIT_BRANCH

# ── Shared deploy template ─────────────────────────────────────────────────────
# All differences between prod and preprod are expressed as job-level variables:
#   DEPLOY_DIR          – root dir on the VPS (/opt/keyhome or /opt/keyhome-preprod)
#   DEPLOY_BRANCH       – git branch to deploy (main / preprod)
#   COMPOSE_SRC_FILE    – compose file to copy (docker-compose.yml / docker-compose.preprod.yml)
#   COMPOSE_FALLBACK    – fallback container-name prefix if COMPOSE_PREFIX not set in .env
#   REQUIRE_ENV_CHECK   – "true" to abort when .env is missing (preprod only)
#   REQUIRE_NETWORK_CHECK – "true" to abort when the shared prod network is absent (preprod only)
#   DEPLOY_POSTGRES_CONTAINER – when compose has no `db` service (preprod shares prod Postgres),
#                               Docker name of the Postgres container (e.g. keyhome-prod-db).
.deploy_template: &deploy_template
  stage: deploy
  needs: [build_image, test_suite]
  timeout: 15 minutes
  interruptible: false
  script:
    # ── Copy compose file + nginx config ───────────────────────────────────────
    # rm -rf avant mkdir : évite les erreurs "Permission denied" si les dossiers
    # ont été créés manuellement en SSH par un autre utilisateur (ex: cedrick).
    # Le runner doit toujours être propriétaire de ces répertoires.
    - rm -rf $DEPLOY_DIR/.docker/nginx/conf.d $DEPLOY_DIR/.docker/nginx/templates $DEPLOY_DIR/.docker/php
    - mkdir -p $DEPLOY_DIR/.docker/nginx/conf.d $DEPLOY_DIR/.docker/nginx/templates $DEPLOY_DIR/.docker/php
    - cp $COMPOSE_SRC_FILE $DEPLOY_DIR/docker-compose.yml
    - cp -rf .docker/nginx/conf.d/. $DEPLOY_DIR/.docker/nginx/conf.d/
    - cp -rf .docker/nginx/templates/. $DEPLOY_DIR/.docker/nginx/templates/
    - cp .docker/php/www.conf $DEPLOY_DIR/.docker/php/www.conf
    # ── Sync codebase to VPS for reference and manual artisan commands ─────────
    # The CI_JOB_TOKEN is needed transiently to authenticate the clone /
    # fetch, but must NOT linger in `.git/config` afterwards — anyone
    # with shell access on the runner (or a co-tenant on a shared VPS)
    # could otherwise `cat .git/config` while the next job runs and
    # exfiltrate the token. Strategy:
    #   1. Build the authenticated URL into a local variable
    #   2. Fetch/clone using that URL
    #   3. Immediately reset the remote URL to the token-less form
    #   4. `chmod 600` the git config as a belt-and-braces measure
    - |
      AUTHENTICATED_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
      CLEAN_URL="https://gitlab.com/${CI_PROJECT_PATH}.git"
      if [ -d $DEPLOY_DIR/codebase/.git ]; then
        cd $DEPLOY_DIR/codebase
        git remote set-url origin "$AUTHENTICATED_URL"
        git fetch origin $DEPLOY_BRANCH && git reset --hard origin/$DEPLOY_BRANCH
        git remote set-url origin "$CLEAN_URL"
        chmod 600 .git/config 2>/dev/null || true
      else
        git clone --depth 1 --branch $DEPLOY_BRANCH "$AUTHENTICATED_URL" $DEPLOY_DIR/codebase
        cd $DEPLOY_DIR/codebase
        git remote set-url origin "$CLEAN_URL"
        chmod 600 .git/config 2>/dev/null || true
        cd -
      fi
      unset AUTHENTICATED_URL
    # ── Optional .env guard (preprod only: REQUIRE_ENV_CHECK=true) ─────────────
    - |
      if [ "${REQUIRE_ENV_CHECK}" = "true" ] && [ ! -f "$DEPLOY_DIR/.env" ]; then
        echo "❌ $DEPLOY_DIR/.env n'existe pas."
        echo "   Créez-le à partir de .env.preprod.example avant le premier déploiement."
        echo "   Variables critiques : COMPOSE_PREFIX=keyhome-preprod, WEB_PORT=9091, DB_HOST=keyhome-db"
        exit 1
      fi
    # ── Optional network guard (preprod shares prod infra: REQUIRE_NETWORK_CHECK=true) ──
    - |
      if [ "${REQUIRE_NETWORK_CHECK}" = "true" ] && ! docker network inspect keyhome_keyhome-network > /dev/null 2>&1; then
        echo "❌ Le réseau 'keyhome_keyhome-network' n'existe pas. Assurez-vous que l'environnement de production est démarré."
        exit 1
      fi
    - cd $DEPLOY_DIR || exit 1
    - export FULL_IMAGE="${CI_REGISTRY_IMAGE}/app:${DEPLOY_BRANCH}"
    - echo "🚀 Deploying image $FULL_IMAGE"
    # ── Save current image for rollback in case migrations fail ────────────────
    - |
      ROLLBACK_IMAGE=$(docker inspect --format='{{.Config.Image}}' ${COMPOSE_PREFIX:-$COMPOSE_FALLBACK}-backend 2>/dev/null || echo "")
      echo "📌 Rollback point: ${ROLLBACK_IMAGE:-none (first deploy)}"
    # Enable maintenance mode before deploy
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan down --retry=60 || true
    - echo "📥 Pulling new image..."
    - APP_IMAGE=$FULL_IMAGE docker compose pull
    - echo "🔄 Starting containers..."
    - APP_IMAGE=$FULL_IMAGE docker compose up -d --no-build --remove-orphans
    # ── Wait for app container to be healthy ───────────────────────────────────
    - |
      echo "⏳ Waiting for containers to be ready..."
      for i in $(seq 1 60); do
        if APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan list > /dev/null 2>&1; then
          echo "✅ App container is ready"
          break
        fi
        if [ "$i" = "60" ]; then
          echo "❌ App container failed to start"
          APP_IMAGE=$FULL_IMAGE docker compose logs app --tail=50
          APP_IMAGE=$FULL_IMAGE docker compose ps -a
          exit 1
        fi
        sleep 2
      done
    # Nginx can cache the old app container IP after app is recreated — refresh web after app is up.
    - echo "🔄 Recreating web (nginx) so FastCGI targets the current app container..."
    - APP_IMAGE=$FULL_IMAGE docker compose up -d --no-build --no-deps --force-recreate web
    # ── Ensure the database + PostGIS extension exist (idempotent) ─────────────
    - |
      DB_NAME=$(grep -E "^DB_DATABASE=" $DEPLOY_DIR/.env 2>/dev/null | cut -d= -f2 | tr -d "[:space:]'\"")
      DB_USER=$(grep -E "^DB_USERNAME=" $DEPLOY_DIR/.env 2>/dev/null | cut -d= -f2 | tr -d "[:space:]'\"")
      DB_NAME=${DB_NAME:-keyhome_prod}
      DB_USER=${DB_USER:-postgres}
      COMPOSE_SERVICES=$(APP_IMAGE=$FULL_IMAGE docker compose config --services 2>/dev/null || true)
      if printf '%s\n' "$COMPOSE_SERVICES" | grep -qx 'db'; then
        echo "🔎 Checking database '${DB_NAME}' exists (compose service db)..."
        db_psql() { APP_IMAGE=$FULL_IMAGE docker compose exec -T db psql "$@"; }
      else
        if [ -z "${DEPLOY_POSTGRES_CONTAINER:-}" ]; then
          echo "❌ Ce fichier compose n'a pas de service 'db'. Définissez la variable GitLab CI/CD DEPLOY_POSTGRES_CONTAINER"
          echo "   avec le nom du conteneur Postgres (ex. keyhome-prod-db) — preprod partage en général celui de la prod."
          exit 1
        fi
        if ! docker inspect "${DEPLOY_POSTGRES_CONTAINER}" >/dev/null 2>&1; then
          echo "❌ Conteneur Postgres '${DEPLOY_POSTGRES_CONTAINER}' introuvable sur ce host. La stack prod tourne-t-elle ?"
          exit 1
        fi
        echo "🔎 Checking database '${DB_NAME}' exists (container ${DEPLOY_POSTGRES_CONTAINER})..."
        # Plain `docker exec` has no `-T` (unlike `docker compose exec`); omit it for old Docker CLI.
        db_psql() { docker exec "${DEPLOY_POSTGRES_CONTAINER}" psql "$@"; }
      fi
      DB_EXISTS=$(db_psql -U "$DB_USER" -d postgres -tAc \
        "SELECT 1 FROM pg_database WHERE datname='${DB_NAME}'" 2>/dev/null || echo "")
      if [ "$DB_EXISTS" != "1" ]; then
        echo "⚠️  Database '${DB_NAME}' not found — creating it..."
        db_psql -U "$DB_USER" -d postgres -c "CREATE DATABASE \"${DB_NAME}\" OWNER \"${DB_USER}\";"
        echo "✅ Database '${DB_NAME}' created."
        echo "🗺  Enabling PostGIS extension..."
        db_psql -U "$DB_USER" -d "$DB_NAME" \
          -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS postgis_topology;"
        echo "✅ PostGIS enabled."
      else
        echo "✅ Database '${DB_NAME}' already exists."
      fi
    # ── Run migrations with automatic rollback on failure ──────────────────────
    # `--isolated` takes a Postgres advisory lock so two concurrent
    # `production_deploy` jobs (e.g. retry + manual trigger overlap)
    # can't both run migrations simultaneously and corrupt the
    # migrations table. The lock is released automatically on
    # process exit.
    - |
      echo "🗾 Running migrations..."
      if ! APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan migrate --force --isolated; then
        echo "❌ Migration failed — rolling back to previous image..."
        APP_IMAGE=$FULL_IMAGE docker compose logs app --tail=30
        if [ -n "$ROLLBACK_IMAGE" ]; then
          echo "🔄 Restoring $ROLLBACK_IMAGE ..."
          APP_IMAGE=$ROLLBACK_IMAGE docker compose up -d --no-build --remove-orphans || true
          APP_IMAGE=$ROLLBACK_IMAGE docker compose exec -T app php artisan up || true
          echo "✅ Rolled back to previous image"
        else
          APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan up || true
        fi
        exit 1
      fi
    # ── Runtime cache rebuild (needs real .env — cannot be done in Docker build) ──
    - echo "🧹 Clearing stale caches..."
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan optimize:clear
    - echo "⚡ Rebuilding runtime caches..."
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app bash resetFilamentLivewire.sh
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan optimize
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan storage:link || true
    # ── Meilisearch: sync settings then full reindex ───────────────────────────
    - echo "🔍 Syncing Meilisearch index settings..."
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan scout:sync-index-settings || true
    # Disable maintenance mode
    - echo "✅ Deployment complete, bringing app back up..."
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan up
    # ── Non-blocking post-deploy tasks (run after app is live) ─────────────────
    # scout:import is launched detached (-d) so the pipeline returns immediately
    # regardless of catalog size — the container process keeps running on its own.
    - echo "🔍 Meilisearch reindex lancé en arrière-plan..."
    - APP_IMAGE=$FULL_IMAGE docker compose exec -dT app php artisan scout:import "App\\Models\\Ad" || true
    - echo "📄 Generating Swagger docs (non-blocking)..."
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan l5-swagger:generate || true
    - echo "🔎 Pinging IndexNow (Bing) + Google sitemap..."
    - |
      if [ -n "${INDEXNOW_KEY}" ]; then
        curl -s "https://api.indexnow.org/indexnow?url=https://keyhome.app/sitemap.xml&key=${INDEXNOW_KEY}" || true
        curl -s "https://www.google.com/ping?sitemap=https://keyhome.app/sitemap.xml" || true
        echo "✅ Sitemap pings sent"
      else
        echo "⚠️  INDEXNOW_KEY not set — skipping sitemap ping"
      fi
  after_script:
    - docker logout $CI_REGISTRY 2>/dev/null || true

# --- ETAPE 2bis : FRONTEND TESTS ---
# The Next.js submodule used to be tested only on GitHub Actions. Since
# the team's primary CD path is GitLab, that left the frontend with no
# gate when GitHub was bypassed (direct push, GitHub outage, secondary
# branch). This job mirrors the GitHub `frontend-test` exactly:
# `frozen-lockfile install` + `pnpm audit --prod` + `tsc --noEmit` +
# `pnpm lint` + `pnpm test` + a real `pnpm build`. It runs on every
# branch that changed frontend files.
frontend_test:
  stage: build_and_test
  image: node:20-alpine
  needs: []
  before_script:
    - apk add --no-cache git
    - corepack enable
    - corepack prepare pnpm@10 --activate
  script:
    - cd keyhome-frontend-next
    - pnpm install --frozen-lockfile
    - pnpm audit --prod --audit-level=critical
    - pnpm exec tsc --noEmit
    - pnpm lint
    - pnpm test
    # Block on broken `pnpm build` — same contract as the GitHub workflow.
    - SKIP_ENV_VALIDATION=1 NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1 NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_placeholder pnpm build
  cache:
    key:
      files:
        - keyhome-frontend-next/pnpm-lock.yaml
    paths:
      - keyhome-frontend-next/node_modules/
      - keyhome-frontend-next/.next/cache/
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - 'keyhome-frontend-next/**/*'

# --- ETAPE 3 : DEPLOIEMENT ---
production_deploy:
  <<: *deploy_template
  # Production deploys require an explicit click. Was fully automatic
  # on every merge to `main` — a bad commit reached live within ~15
  # min with no human in the loop. The `environment` block also gives
  # GitLab a Deployments record, per-env secret scoping, and freeze
  # windows.
  environment:
    name: production
    url: https://api.keyhome.app
    deployment_tier: production
  when: manual
  allow_failure: false
  variables:
    DEPLOY_DIR: /opt/keyhome
    DEPLOY_BRANCH: main
    COMPOSE_SRC_FILE: docker-compose.yml
    COMPOSE_FALLBACK: keyhome-prod
    REQUIRE_ENV_CHECK: "false"
    REQUIRE_NETWORK_CHECK: "false"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# --- DEPLOIEMENT PREPROD ---
preprod_deploy:
  <<: *deploy_template
  # Preprod stays auto — it's the staging environment and acts as the
  # smoke target for the production manual approval upstream.
  environment:
    name: preprod
    url: https://preprod.api.keyhome.app
    deployment_tier: staging
  variables:
    DEPLOY_DIR: /opt/keyhome-preprod
    DEPLOY_BRANCH: preprod
    COMPOSE_SRC_FILE: docker-compose.preprod.yml
    COMPOSE_FALLBACK: keyhome-preprod
    DEPLOY_POSTGRES_CONTAINER: keyhome-prod-db
    REQUIRE_ENV_CHECK: "true"
    REQUIRE_NETWORK_CHECK: "true"
  rules:
    - if: $CI_COMMIT_BRANCH == "preprod"

# --- ETAPE 4 : SMOKE TEST ---
production_smoke_test:
  stage: smoke_test
  needs: [production_deploy]
  script:
    - echo "Running smoke tests on production..."
    - |
      # PROD_API_URL must be set in GitLab CI/CD Variables (e.g. https://api.keyhome.app)
      SMOKE_URL="${PROD_API_URL:-https://api.keyhome.app}"
      echo "Smoke URL: $SMOKE_URL"
      set +e
      # Hit /api/health (not /api/ping) — /ping returns 200 even when
      # the DB is down or Filament 500s. /api/health probes DB +
      # Redis + Queue + Storage + Meilisearch and returns 503 if any
      # subsystem is unhealthy. The deeper probe catches the class of
      # post-deploy break the old smoke test silently passed through.
      # If HEALTH_CHECK_TOKEN is set on prod, smoke needs to send it.
      AUTH_HEADER=""
      if [ -n "${PROD_HEALTH_CHECK_TOKEN:-}" ]; then
        AUTH_HEADER="-H Authorization: Bearer ${PROD_HEALTH_CHECK_TOKEN}"
      fi
      for i in $(seq 1 10); do
        RESPONSE=$(curl --globoff --silent --write-out "\n%{http_code}" $AUTH_HEADER "${SMOKE_URL}/api/health" 2>/dev/null)
        STATUS=$(echo "$RESPONSE" | tail -n 1)
        BODY=$(echo "$RESPONSE" | sed '$d')
        echo "Attempt $i — HTTP $STATUS"
        if [ "$STATUS" = "200" ]; then
          echo "✅ Smoke test passed"
          echo "Health: $BODY"
          exit 0
        fi
        if [ "$STATUS" = "503" ]; then
          echo "⚠️  Service responded 503 — body: $BODY"
        fi
        sleep 5
      done
      echo "❌ Production smoke test failed after 10 attempts"
      exit 1
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

preprod_smoke_test:
  stage: smoke_test
  needs: [preprod_deploy]
  script:
    - echo "Running smoke tests on preproduction..."
    - |
      set +e
      PREPROD_PORT=$(grep -E "^WEB_PORT=" /opt/keyhome-preprod/.env 2>/dev/null | cut -d= -f2 | tr -d "[:space:]'\"" )
      PREPROD_PORT=${PREPROD_PORT:-9091}
      FULL_IMAGE="${CI_REGISTRY_IMAGE}/app:preprod"
      echo "Using port: $PREPROD_PORT"
      # Match the production smoke depth — `/api/health` probes DB,
      # Redis, Queue, Storage, Meilisearch and reports 503 when any
      # subsystem is unhealthy. `/api/ping` always returns 200 even
      # against a broken stack.
      AUTH_HEADER=""
      if [ -n "${PREPROD_HEALTH_CHECK_TOKEN:-}" ]; then
        AUTH_HEADER="-H Authorization: Bearer ${PREPROD_HEALTH_CHECK_TOKEN}"
      fi
      for i in $(seq 1 15); do
        RESPONSE=$(curl --globoff --silent --write-out "\n%{http_code}" $AUTH_HEADER "http://127.0.0.1:${PREPROD_PORT}/api/health" 2>/dev/null)
        STATUS=$(echo "$RESPONSE" | tail -n 1)
        BODY=$(echo "$RESPONSE" | sed '$d')
        echo "Attempt $i — HTTP $STATUS"
        if [ "$STATUS" = "200" ]; then
          echo "✅ Smoke test passed"
          echo "Health: $BODY"
          exit 0
        fi
        if [ "$STATUS" = "503" ]; then
          echo "⚠️  Service responded 503 — body: $BODY"
        fi
        sleep 5
      done
      echo "❌ Preproduction smoke test failed after 15 attempts"
      echo "--- docker compose ps ---"
      cd /opt/keyhome-preprod && APP_IMAGE=$FULL_IMAGE docker compose ps -a || true
      echo "--- docker compose logs (web, app) ---"
      cd /opt/keyhome-preprod && APP_IMAGE=$FULL_IMAGE docker compose logs web app --tail=120 || true
      echo "--- curl -v /up (last 40 lines) ---"
      curl --globoff -v --max-time 15 "http://127.0.0.1:${PREPROD_PORT}/up" 2>&1 | tail -40 || true
      exit 1
  rules:
    - if: $CI_COMMIT_BRANCH == "preprod"

# ─────────────────────────────────────────────────────────────────────
# ETAPE 5 : NOTIFICATIONS EMAIL (via Resend)
# ─────────────────────────────────────────────────────────────────────
#
# Variables GitLab CI/CD a configurer (Settings → CI/CD → Variables) :
#   RESEND_API_KEY         (Masked, Protected) — cle API Resend
#   DEPLOY_NOTIFY_EMAIL    (Protected)         — destinataire(s), CSV
#                                                ex: "cedrick@neocraft.com,ops@keyhome.app"
#   DEPLOY_NOTIFY_FROM     (optionnel)         — expediteur,
#                                                default "KeyHome CI <ci@keyhome.app>"
#
# Le domaine `keyhome.app` doit etre verifie dans Resend (DNS SPF +
# DKIM). En attendant la verification, fallback `onboarding@resend.dev`
# fonctionne pour tester (rate-limite a 100 mails/jour).
#
# Template HTML : table-based + CSS inline pour la compat email clients
# (Gmail / Outlook / Apple Mail / mobile). Tons KeyHome (rose #F6475F
# pour les CTAs, vert/rouge pour le status banner).

.email_notify_base: &email_notify_base
  stage: notify
  allow_failure: true
  variables:
    # Note : pas de `set -euo pipefail` dans les scripts notify — on
    # ne veut PAS qu'un email rate fasse echouer la pipeline (allow_
    # failure deja, mais double ceinture). Tout est en `|| true`.
    RESEND_ENDPOINT: "https://api.resend.com/emails"

email_success:
  <<: *email_notify_base
  needs:
    - job: production_smoke_test
      optional: true
    - job: preprod_smoke_test
      optional: true
    - job: production_deploy
      optional: true
    - job: preprod_deploy
      optional: true
  when: on_success
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "preprod"
  script:
    - |
      RECIPIENTS="${DEPLOY_NOTIFY_EMAIL:-}"
      API_KEY="${RESEND_API_KEY:-}"
      if [ -z "$RECIPIENTS" ] || [ -z "$API_KEY" ]; then
        echo "ℹ  Email skipped (DEPLOY_NOTIFY_EMAIL ou RESEND_API_KEY non configuree)"
        exit 0
      fi
      export EMAIL_STATUS="success"
      bash .gitlab/notify-email.sh
  artifacts:
    when: always
    paths: []

email_failure:
  <<: *email_notify_base
  needs:
    - job: production_smoke_test
      optional: true
    - job: preprod_smoke_test
      optional: true
    - job: production_deploy
      optional: true
    - job: preprod_deploy
      optional: true
    - job: test_suite
      optional: true
    - job: phpstan
      optional: true
    - job: style_check
      optional: true
    - job: composer_security
      optional: true
    - job: build_image
      optional: true
    - job: trivy_scan
      optional: true
  when: on_failure
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - |
      RECIPIENTS="${DEPLOY_NOTIFY_EMAIL:-}"
      API_KEY="${RESEND_API_KEY:-}"
      if [ -z "$RECIPIENTS" ] || [ -z "$API_KEY" ]; then
        echo "ℹ  Email skipped (DEPLOY_NOTIFY_EMAIL ou RESEND_API_KEY non configuree)"
        exit 0
      fi
      export EMAIL_STATUS="failure"
      bash .gitlab/notify-email.sh

# --- ETAPE 6 : NETTOYAGE INTELLIGENT ---
cleanup:
  stage: cleanup
  script:
    - |
      echo "🧹 ══════════════════════════════════════════════"
      echo "🧹  CLEANUP PIPELINE — branch: $CI_COMMIT_BRANCH"
      echo "🧹 ══════════════════════════════════════════════"

      # ── 1. Image CI (feature branches seulement) ──────────────────────────
      # main/preprod conservées → cache du prochain pipeline
      # feature branch → supprimée (~1.4 GB de fantôme sinon)
      if [ "$CI_COMMIT_BRANCH" != "main" ] && [ "$CI_COMMIT_BRANCH" != "preprod" ]; then
        if docker image inspect $CI_IMAGE >/dev/null 2>&1; then
          docker rmi $CI_IMAGE 2>/dev/null || true
          echo "  ✓ Image CI feature-branch supprimée ($CI_IMAGE)"
        fi
      fi

      # ── 2. Images dangling (sans tag = orphelines de build) ───────────────
      DANGLING=$(docker images -f "dangling=true" -q 2>/dev/null | wc -l | tr -d ' ')
      if [ "$DANGLING" -gt 0 ]; then
        docker rmi $(docker images -f "dangling=true" -q) 2>/dev/null || true
        echo "  ✓ $DANGLING images dangling supprimées"
      else
        echo "  ✓ Aucune image dangling"
      fi

      # ── 3. Containers arrêtés (> 1h) ──────────────────────────────────────
      docker container prune -f --filter "until=1h" 2>/dev/null || true
      echo "  ✓ Containers arrêtés nettoyés (> 1h)"

      # ── 4. Networks inutilisés ─────────────────────────────────────────────
      docker network prune -f --filter "until=1h" 2>/dev/null || true
      echo "  ✓ Networks inutilisés nettoyés"

      # ── 5. Build cache (garde 10 GB pour ne pas casser le cache-from) ─────
      docker builder prune -f --keep-storage=10GB 2>/dev/null || true
      echo "  ✓ Build cache nettoyé (10 GB conservés)"

      # ── 6. Nettoyage VPS (runner = même machine que le VPS) ───────────────
      #    Volumes preprod orphelins connus (ancien nom de projet)
      ORPHAN_VOLUMES="keyhome-preprod_keyhome-app-code keyhome-preprod_keyhome-db-data keyhome-preprod_keyhome-meilisearch-data keyhome-preprod_keyhome-storage-data"
      for vol in $ORPHAN_VOLUMES; do
        if docker volume inspect "$vol" >/dev/null 2>&1; then
          docker volume rm "$vol" 2>/dev/null && echo "  ✓ Volume orphelin supprimé: $vol" || echo "  ⚠ Volume $vol en cours d'utilisation — ignoré"
        fi
      done

      # ── 7. Alerte disque (seuil 80%) ──────────────────────────────────────
      DISK_USED=$(df /var/lib/docker | awk 'NR==2{print $5}' | tr -d '%')
      echo ""
      echo "💾 Utilisation disque /var/lib/docker : ${DISK_USED}%"
      if [ "$DISK_USED" -ge 80 ]; then
        echo "  🚨 ALERTE : disque > 80% ! Nettoyage agressif en cours..."
        docker system prune -af --volumes --filter "label!=com.docker.compose.service=db" 2>/dev/null || true
        docker builder prune -af 2>/dev/null || true
        echo "  ✓ Nettoyage agressif terminé"
      elif [ "$DISK_USED" -ge 70 ]; then
        echo "  ⚠  AVERTISSEMENT : disque > 70% — surveiller l'espace"
      else
        echo "  ✓ Espace disque OK"
      fi

      # ── 8. Rapport final ──────────────────────────────────────────────────
      echo ""
      echo "📊 Résumé après nettoyage :"
      docker system df 2>/dev/null || true
      echo ""
      echo "🏁 Cleanup terminé."
  when: always
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH
