stages:
  - prepare
  - quality
  - build_and_test # Build + Test en parallèle
  - deploy
  - smoke_test # Vérification post-déploiement
  - notify
  - cleanup

workflow:
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[skip ci\]/i
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  APP_IMAGE: $CI_REGISTRY_IMAGE/app
  IMAGE_TAG: $CI_COMMIT_REF_SLUG
  CI_IMAGE: $CI_REGISTRY_IMAGE/ci:$CI_COMMIT_REF_SLUG

default:
  tags:
    - self-hosted-shell
  interruptible: true
  before_script:
    # Centralisation de l'authentification Docker
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# --- ETAPE 0 : BUILD IMAGE CI (une seule fois) ---
# The CI image contains ONLY PHP extensions + Composer + installed vendor deps.
# It does NOT include the application code, so `composer install` is only
# re-run when composer.lock changes — not on every commit.
prepare_ci_image:
  stage: prepare
  script:
    - |
      # Only push the CI image to the registry on protected branches (main / preprod).
      # On feature branches we still BUILD the image locally so the quality jobs
      # (phpstan, pint, rector, composer_audit, test_suite) on the SAME self-hosted
      # runner can use it — but we skip the push to avoid polluting the registry
      # with one ~1.4 GB image per branch slug.
      #
      # Cache source: on feature branches we pull ci:main (stable base) instead of
      # a per-branch tag that doesn't exist, so the build still benefits from layer
      # caching.
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "preprod" ]; then
        CACHE_FROM=$CI_IMAGE
      else
        CACHE_FROM=$CI_REGISTRY_IMAGE/ci:main
      fi
      docker pull $CACHE_FROM || true
      docker build --cache-from $CACHE_FROM -t $CI_IMAGE -f - . <<'DOCKERFILE'
      FROM php:8.4-cli-alpine
      RUN apk add --no-cache git libzip-dev icu-dev postgresql-dev libpng-dev oniguruma-dev gettext-dev freetype-dev libjpeg-turbo-dev libwebp-dev $PHPIZE_DEPS \
        && docker-php-ext-configure gd --with-freetype --with-jpeg --with-webp \
        && docker-php-ext-install bcmath intl pdo_pgsql mbstring zip gd exif gettext \
        && pecl install redis && docker-php-ext-enable redis \
        && apk del $PHPIZE_DEPS && rm -rf /tmp/*
      COPY --from=composer:latest /usr/bin/composer /usr/bin/composer
      WORKDIR /app
      # Layer 1: install deps (cached until composer.lock changes)
      COPY composer.json composer.lock ./
      RUN mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache \
        && touch .env \
        && composer install --no-interaction --no-ansi --no-scripts -q
      # Layer 2: copy code (fast, does not re-run composer install)
      COPY . .
      DOCKERFILE
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ "$CI_COMMIT_BRANCH" = "preprod" ]; then
        docker push $CI_IMAGE || true
      else
        echo "ℹ️  Skipping registry push for feature branch '$CI_COMMIT_BRANCH' (image kept locally on runner)"
      fi
  retry:
    max: 2
    when: runner_system_failure
  rules:
    - if: $CI_COMMIT_BRANCH

# --- ETAPE 1 : QUALITY (tous en parallele) ---
phpstan:
  stage: quality
  needs: [prepare_ci_image]
  script:
    - docker run --rm -e APP_KEY="base64:$(openssl rand -base64 32)" $CI_IMAGE ./vendor/bin/phpstan analyse --memory-limit=512M
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - '**/*.php'

style_check:
  stage: quality
  needs: [prepare_ci_image]
  script:
    - docker run --rm $CI_IMAGE ./vendor/bin/pint --test
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - '**/*.php'

composer_security:
  stage: quality
  needs: [prepare_ci_image]
  script:
    - docker run --rm $CI_IMAGE composer audit --abandoned=ignore
  rules:
    - if: $CI_COMMIT_BRANCH

# Rector — automated refactor checks. Runs in --dry-run so it never modifies CI;
# fails the job if there are unapplied automatic upgrades / fixes that should be
# committed before merge.
rector:
  stage: quality
  needs: [prepare_ci_image]
  allow_failure: true # advisory in CI: do not block the pipeline (yet) — see AGENTS.md
  script:
    - docker run --rm $CI_IMAGE ./vendor/bin/rector process --dry-run --no-progress-bar
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - '**/*.php'
        - rector.php

# --- ETAPE 2 : BUILD & PUSH (en parallèle avec tests) ---
build_image:
  stage: build_and_test
  variables:
    DOCKER_BUILDKIT: "1"
  needs:
    - job: phpstan
      optional: true
    - job: style_check
      optional: true
    - job: composer_security
  script:
    # Pull the previous image to use as a cache source — dramatically speeds up
    # builds when only code (not dependencies) changed.
    - docker pull $APP_IMAGE:latest || true
    - docker build --cache-from $APP_IMAGE:latest -t $APP_IMAGE:$IMAGE_TAG .
    - docker push $APP_IMAGE:$IMAGE_TAG
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag $APP_IMAGE:$IMAGE_TAG $APP_IMAGE:latest
        docker push $APP_IMAGE:latest
      fi
  after_script:
    - docker logout $CI_REGISTRY 2>/dev/null || true
  retry:
    max: 2
    when: runner_system_failure
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "preprod"

# --- ETAPE 2 : TESTS (en parallèle avec build) ---
test_suite:
  stage: build_and_test
  needs: [prepare_ci_image]
  timeout: 10 minutes
  retry:
    max: 2
    when: runner_system_failure
  script:
    - |
      # Create isolated network for this job
      docker network create ci-net-$CI_JOB_ID

      # Start PostgreSQL with PostGIS
      docker run -d \
        --name pg-$CI_JOB_ID \
        --network ci-net-$CI_JOB_ID \
        -e POSTGRES_DB=testing \
        -e POSTGRES_USER=gitlab \
        -e POSTGRES_PASSWORD=test_pass \
        postgis/postgis:15-3.3-alpine

      # Wait until PostgreSQL accepts TCP connections (not just Unix socket).
      # pg_isready without -h checks /var/run/postgresql (Unix socket) which
      # becomes ready before TCP is bound — causing cross-container ECONNREFUSED.
      echo "Waiting for PostgreSQL..."
      for i in $(seq 1 30); do
        docker exec pg-$CI_JOB_ID pg_isready -U gitlab -h 127.0.0.1 -p 5432 && break
        [ "$i" = "30" ] && echo "PostgreSQL failed to start" && exit 1
        sleep 2
      done

      # Run test suite inside CI image
      docker run --rm \
        --network ci-net-$CI_JOB_ID \
        -e DB_CONNECTION=pgsql \
        -e DB_HOST=pg-$CI_JOB_ID \
        -e DB_PORT=5432 \
        -e DB_DATABASE=testing \
        -e DB_USERNAME=gitlab \
        -e DB_PASSWORD=test_pass \
        -e SCOUT_DRIVER=null \
        -e MAIL_MAILER=array \
        -e RESEND_KEY= \
        $CI_IMAGE sh -c \
        'set -e
        cp .env.example .env
        cp .env.example .env.testing
        rm -f database/data/cities.sql
        php artisan key:generate --env=testing
        php artisan migrate --env=testing --force
        echo "=== RUNNING TESTS ==="
        set +e
        php artisan test --env=testing -v 2>&1
        TEST_RC=$?
        echo "=== TESTS FINISHED WITH RC=$TEST_RC ==="
        exit $TEST_RC'
  after_script:
    - docker rm -f pg-$CI_JOB_ID 2>/dev/null || true
    - docker network rm ci-net-$CI_JOB_ID 2>/dev/null || true
  rules:
    - if: $CI_COMMIT_BRANCH

# ── Shared deploy template ─────────────────────────────────────────────────────
# All differences between prod and preprod are expressed as job-level variables:
#   DEPLOY_DIR          – root dir on the VPS (/opt/keyhome or /opt/keyhome-preprod)
#   DEPLOY_BRANCH       – git branch to deploy (main / preprod)
#   COMPOSE_SRC_FILE    – compose file to copy (docker-compose.yml / docker-compose.preprod.yml)
#   COMPOSE_FALLBACK    – fallback container-name prefix if COMPOSE_PREFIX not set in .env
#   REQUIRE_ENV_CHECK   – "true" to abort when .env is missing (preprod only)
#   REQUIRE_NETWORK_CHECK – "true" to abort when the shared prod network is absent (preprod only)
#   DEPLOY_POSTGRES_CONTAINER – when compose has no `db` service (preprod shares prod Postgres),
#                               Docker name of the Postgres container (e.g. keyhome-prod-db).
.deploy_template: &deploy_template
  stage: deploy
  needs: [build_image, test_suite]
  timeout: 15 minutes
  interruptible: false
  script:
    # ── Copy compose file + nginx config ───────────────────────────────────────
    - mkdir -p $DEPLOY_DIR/.docker/nginx/conf.d
    - cp $COMPOSE_SRC_FILE $DEPLOY_DIR/docker-compose.yml
    - cp -rf .docker/nginx/conf.d/. $DEPLOY_DIR/.docker/nginx/conf.d/
    # ── Sync codebase to VPS for reference and manual artisan commands ─────────
    - |
      AUTHENTICATED_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
      if [ -d $DEPLOY_DIR/codebase/.git ]; then
        cd $DEPLOY_DIR/codebase
        git remote set-url origin "$AUTHENTICATED_URL"
        git fetch origin $DEPLOY_BRANCH && git reset --hard origin/$DEPLOY_BRANCH
      else
        git clone --depth 1 --branch $DEPLOY_BRANCH "$AUTHENTICATED_URL" $DEPLOY_DIR/codebase
      fi
    # ── Optional .env guard (preprod only: REQUIRE_ENV_CHECK=true) ─────────────
    - |
      if [ "${REQUIRE_ENV_CHECK}" = "true" ] && [ ! -f "$DEPLOY_DIR/.env" ]; then
        echo "❌ $DEPLOY_DIR/.env n'existe pas."
        echo "   Créez-le à partir de .env.preprod.example avant le premier déploiement."
        echo "   Variables critiques : COMPOSE_PREFIX=keyhome-preprod, WEB_PORT=9091, DB_HOST=keyhome-db"
        exit 1
      fi
    # ── Optional network guard (preprod shares prod infra: REQUIRE_NETWORK_CHECK=true) ──
    - |
      if [ "${REQUIRE_NETWORK_CHECK}" = "true" ] && ! docker network inspect keyhome_keyhome-network > /dev/null 2>&1; then
        echo "❌ Le réseau 'keyhome_keyhome-network' n'existe pas. Assurez-vous que l'environnement de production est démarré."
        exit 1
      fi
    - cd $DEPLOY_DIR || exit 1
    - export FULL_IMAGE="${CI_REGISTRY_IMAGE}/app:${DEPLOY_BRANCH}"
    - echo "🚀 Deploying image $FULL_IMAGE"
    # ── Save current image for rollback in case migrations fail ────────────────
    - |
      ROLLBACK_IMAGE=$(docker inspect --format='{{.Config.Image}}' ${COMPOSE_PREFIX:-$COMPOSE_FALLBACK}-backend 2>/dev/null || echo "")
      echo "📌 Rollback point: ${ROLLBACK_IMAGE:-none (first deploy)}"
    # Enable maintenance mode before deploy
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan down --retry=60 || true
    - echo "📥 Pulling new image..."
    - APP_IMAGE=$FULL_IMAGE docker compose pull
    - echo "🔄 Starting containers..."
    - APP_IMAGE=$FULL_IMAGE docker compose up -d --no-build --remove-orphans
    # ── Wait for app container to be healthy ───────────────────────────────────
    - |
      echo "⏳ Waiting for containers to be ready..."
      for i in $(seq 1 60); do
        if APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan list > /dev/null 2>&1; then
          echo "✅ App container is ready"
          break
        fi
        if [ "$i" = "60" ]; then
          echo "❌ App container failed to start"
          APP_IMAGE=$FULL_IMAGE docker compose logs app --tail=50
          APP_IMAGE=$FULL_IMAGE docker compose ps -a
          exit 1
        fi
        sleep 2
      done
    # Nginx can cache the old app container IP after app is recreated — refresh web after app is up.
    - echo "🔄 Recreating web (nginx) so FastCGI targets the current app container..."
    - APP_IMAGE=$FULL_IMAGE docker compose up -d --no-build --no-deps --force-recreate web
    # ── Ensure the database + PostGIS extension exist (idempotent) ─────────────
    - |
      DB_NAME=$(grep -E "^DB_DATABASE=" $DEPLOY_DIR/.env 2>/dev/null | cut -d= -f2 | tr -d "[:space:]'\"")
      DB_USER=$(grep -E "^DB_USERNAME=" $DEPLOY_DIR/.env 2>/dev/null | cut -d= -f2 | tr -d "[:space:]'\"")
      DB_NAME=${DB_NAME:-keyhome_prod}
      DB_USER=${DB_USER:-postgres}
      COMPOSE_SERVICES=$(APP_IMAGE=$FULL_IMAGE docker compose config --services 2>/dev/null || true)
      if printf '%s\n' "$COMPOSE_SERVICES" | grep -qx 'db'; then
        echo "🔎 Checking database '${DB_NAME}' exists (compose service db)..."
        db_psql() { APP_IMAGE=$FULL_IMAGE docker compose exec -T db psql "$@"; }
      else
        if [ -z "${DEPLOY_POSTGRES_CONTAINER:-}" ]; then
          echo "❌ Ce fichier compose n'a pas de service 'db'. Définissez la variable GitLab CI/CD DEPLOY_POSTGRES_CONTAINER"
          echo "   avec le nom du conteneur Postgres (ex. keyhome-prod-db) — preprod partage en général celui de la prod."
          exit 1
        fi
        if ! docker inspect "${DEPLOY_POSTGRES_CONTAINER}" >/dev/null 2>&1; then
          echo "❌ Conteneur Postgres '${DEPLOY_POSTGRES_CONTAINER}' introuvable sur ce host. La stack prod tourne-t-elle ?"
          exit 1
        fi
        echo "🔎 Checking database '${DB_NAME}' exists (container ${DEPLOY_POSTGRES_CONTAINER})..."
        # Plain `docker exec` has no `-T` (unlike `docker compose exec`); omit it for old Docker CLI.
        db_psql() { docker exec "${DEPLOY_POSTGRES_CONTAINER}" psql "$@"; }
      fi
      DB_EXISTS=$(db_psql -U "$DB_USER" -d postgres -tAc \
        "SELECT 1 FROM pg_database WHERE datname='${DB_NAME}'" 2>/dev/null || echo "")
      if [ "$DB_EXISTS" != "1" ]; then
        echo "⚠️  Database '${DB_NAME}' not found — creating it..."
        db_psql -U "$DB_USER" -d postgres -c "CREATE DATABASE \"${DB_NAME}\" OWNER \"${DB_USER}\";"
        echo "✅ Database '${DB_NAME}' created."
        echo "🗺  Enabling PostGIS extension..."
        db_psql -U "$DB_USER" -d "$DB_NAME" \
          -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS postgis_topology;"
        echo "✅ PostGIS enabled."
      else
        echo "✅ Database '${DB_NAME}' already exists."
      fi
    # ── Run migrations with automatic rollback on failure ──────────────────────
    - |
      echo "🗾 Running migrations..."
      if ! APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan migrate --force; then
        echo "❌ Migration failed — rolling back to previous image..."
        APP_IMAGE=$FULL_IMAGE docker compose logs app --tail=30
        if [ -n "$ROLLBACK_IMAGE" ]; then
          echo "🔄 Restoring $ROLLBACK_IMAGE ..."
          APP_IMAGE=$ROLLBACK_IMAGE docker compose up -d --no-build --remove-orphans || true
          APP_IMAGE=$ROLLBACK_IMAGE docker compose exec -T app php artisan up || true
          echo "✅ Rolled back to previous image"
        else
          APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan up || true
        fi
        exit 1
      fi
    # ── Runtime cache rebuild (needs real .env — cannot be done in Docker build) ──
    - echo "🧹 Clearing stale caches..."
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan optimize:clear
    - echo "⚡ Rebuilding runtime caches..."
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app bash resetFilamentLivewire.sh
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan optimize
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan storage:link || true
    # ── Meilisearch: sync settings then full reindex ───────────────────────────
    - echo "🔍 Syncing Meilisearch index settings..."
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan scout:sync-index-settings || true
    # Disable maintenance mode
    - echo "✅ Deployment complete, bringing app back up..."
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan up
    # ── Non-blocking post-deploy tasks (run after app is live) ─────────────────
    # NOTE: Full `scout:import` is intentionally NOT run here — it scans every Ad
    # row and degrades deploy time linearly with catalog size. Reindex is now
    # triggered by Eloquent observers (HasMedia / Searchable) on writes, plus a
    # nightly `php artisan scout:import App\\Models\\Ad` cron for drift recovery
    # (see AGENTS.md scaling section). This is also safer for blue/green deploys.
    - echo "📄 Generating Swagger docs (non-blocking)..."
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan l5-swagger:generate || true
  after_script:
    - docker logout $CI_REGISTRY 2>/dev/null || true

# --- ETAPE 3 : DEPLOIEMENT ---
production_deploy:
  <<: *deploy_template
  variables:
    DEPLOY_DIR: /opt/keyhome
    DEPLOY_BRANCH: main
    COMPOSE_SRC_FILE: docker-compose.yml
    COMPOSE_FALLBACK: keyhome-prod
    REQUIRE_ENV_CHECK: "false"
    REQUIRE_NETWORK_CHECK: "false"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# --- DEPLOIEMENT PREPROD ---
preprod_deploy:
  <<: *deploy_template
  variables:
    DEPLOY_DIR: /opt/keyhome-preprod
    DEPLOY_BRANCH: preprod
    COMPOSE_SRC_FILE: docker-compose.preprod.yml
    COMPOSE_FALLBACK: keyhome-preprod
    DEPLOY_POSTGRES_CONTAINER: keyhome-prod-db
    REQUIRE_ENV_CHECK: "true"
    REQUIRE_NETWORK_CHECK: "true"
  rules:
    - if: $CI_COMMIT_BRANCH == "preprod"

# --- ETAPE 4 : SMOKE TEST ---
production_smoke_test:
  stage: smoke_test
  needs: [production_deploy]
  script:
    - echo "Running smoke tests on production..."
    - |
      # PROD_API_URL must be set in GitLab CI/CD Variables (e.g. https://api.keyhome.app)
      SMOKE_URL="${PROD_API_URL:-https://api.keyhome.app}"
      echo "Smoke URL: $SMOKE_URL"
      set +e
      for i in $(seq 1 10); do
        STATUS=$(curl --globoff --silent --output /dev/null --write-out "%{http_code}" "${SMOKE_URL}/api/ping" 2>/dev/null)
        echo "Attempt $i — HTTP $STATUS"
        if [ "$STATUS" = "200" ]; then
          echo "✅ Smoke test passed"
          exit 0
        fi
        sleep 5
      done
      echo "❌ Production smoke test failed after 10 attempts"
      exit 1
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

preprod_smoke_test:
  stage: smoke_test
  needs: [preprod_deploy]
  script:
    - echo "Running smoke tests on preproduction..."
    - |
      set +e
      PREPROD_PORT=$(grep -E "^WEB_PORT=" /opt/keyhome-preprod/.env 2>/dev/null | cut -d= -f2 | tr -d "[:space:]'\"" )
      PREPROD_PORT=${PREPROD_PORT:-9091}
      FULL_IMAGE="${CI_REGISTRY_IMAGE}/app:preprod"
      echo "Using port: $PREPROD_PORT"
      for i in $(seq 1 15); do
        STATUS=$(curl --globoff --silent --output /dev/null --write-out "%{http_code}" "http://127.0.0.1:${PREPROD_PORT}/api/ping" 2>/dev/null)
        echo "Attempt $i — HTTP $STATUS (GET /api/ping)"
        if [ "$STATUS" = "200" ]; then
          echo "✅ Smoke test passed"
          exit 0
        fi
        sleep 5
      done
      echo "❌ Preproduction smoke test failed after 15 attempts"
      echo "--- docker compose ps ---"
      cd /opt/keyhome-preprod && APP_IMAGE=$FULL_IMAGE docker compose ps -a || true
      echo "--- docker compose logs (web, app) ---"
      cd /opt/keyhome-preprod && APP_IMAGE=$FULL_IMAGE docker compose logs web app --tail=120 || true
      echo "--- curl -v /up (last 40 lines) ---"
      curl --globoff -v --max-time 15 "http://127.0.0.1:${PREPROD_PORT}/up" 2>&1 | tail -40 || true
      exit 1
  rules:
    - if: $CI_COMMIT_BRANCH == "preprod"

# --- ETAPE 5 : NOTIFICATION SLACK ---
slack_success:
  stage: notify
  allow_failure: true
  needs:
    - job: production_smoke_test
      optional: true
    - job: preprod_smoke_test
      optional: true
    - job: production_deploy
      optional: true
    - job: preprod_deploy
      optional: true
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        WEBHOOK="$SLACK_WEBHOOK_PROD"
        DEPLOY_ENV="Production"
      else
        WEBHOOK="${SLACK_WEBHOOK_PREPROD:-$SLACK_WEBHOOK_PROD}"
        DEPLOY_ENV="Preproduction"
      fi
      if [ -z "$WEBHOOK" ]; then
        echo "No Slack webhook configured for branch $CI_COMMIT_BRANCH, skipping"
        exit 0
      fi
      SHORT_SHA="${CI_COMMIT_SHA:0:8}"

      curl --globoff -sS -X POST -H 'Content-type: application/json' \
      --data "{
        \"attachments\": [{
          \"color\": \"#28a745\",
          \"blocks\": [
            {
              \"type\": \"header\",
              \"text\": {\"type\": \"plain_text\", \"text\": \"✅ Déploiement Backend $DEPLOY_ENV Réussi\", \"emoji\": true}
            },
            {
              \"type\": \"section\",
              \"fields\": [
                {\"type\": \"mrkdwn\", \"text\": \"*Environnement:*\\n$DEPLOY_ENV\"},
                {\"type\": \"mrkdwn\", \"text\": \"*Branche:*\\n\`$CI_COMMIT_REF_NAME\`\"},
                {\"type\": \"mrkdwn\", \"text\": \"*Auteur:*\\n$GITLAB_USER_NAME\"},
                {\"type\": \"mrkdwn\", \"text\": \"*Commit:*\\n\`$SHORT_SHA\`\"}
              ]
            },
            {
              \"type\": \"section\",
              \"text\": {\"type\": \"mrkdwn\", \"text\": \"📝 _${CI_COMMIT_TITLE}_\"}
            },
            {
              \"type\": \"actions\",
              \"elements\": [
                {\"type\": \"button\", \"text\": {\"type\": \"plain_text\", \"text\": \"🚀 Voir la pipeline\"}, \"style\": \"primary\", \"url\": \"$CI_PROJECT_URL/-/pipelines/$CI_PIPELINE_ID\"}
              ]
            }
          ]
        }]
      }" "$WEBHOOK"
  when: on_success
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "preprod"

slack_failure:
  stage: notify
  allow_failure: true
  needs:
    - job: production_smoke_test
      optional: true
    - job: preprod_smoke_test
      optional: true
    - job: production_deploy
      optional: true
    - job: preprod_deploy
      optional: true
    - job: test_suite
      optional: true
    - job: phpstan
      optional: true
    - job: style_check
      optional: true
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        WEBHOOK="$SLACK_WEBHOOK_PROD"
      else
        WEBHOOK="${SLACK_WEBHOOK_PREPROD:-$SLACK_WEBHOOK_PROD}"
      fi
      if [ -z "$WEBHOOK" ]; then
        echo "No Slack webhook configured for branch $CI_COMMIT_BRANCH, skipping"
        exit 0
      fi
      SHORT_SHA="${CI_COMMIT_SHA:0:8}"

      # Récupérer le vrai job qui a échoué via l'API GitLab
      FAILED_JOBS_JSON=$(curl --globoff -sS --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/jobs?scope[]=failed" 2>/dev/null || echo "[]")

      # Extraire le premier job échoué (sans jq, avec grep/sed)
      FAILED_JOB=$(echo "$FAILED_JOBS_JSON" | grep -o '"name":"[^"]*"' | head -1 | sed 's/"name":"//;s/"//' || echo "unknown")
      FAILED_STAGE=$(echo "$FAILED_JOBS_JSON" | grep -o '"stage":"[^"]*"' | head -1 | sed 's/"stage":"//;s/"//' || echo "unknown")

      # Fallback si l'API ne retourne rien
      [ -z "$FAILED_JOB" ] && FAILED_JOB="Voir la pipeline"
      [ -z "$FAILED_STAGE" ] && FAILED_STAGE="unknown"

      curl --globoff -sS -X POST -H 'Content-type: application/json' \
      --data "{
        \"attachments\": [{
          \"color\": \"#dc3545\",
          \"blocks\": [
            {
              \"type\": \"header\",
              \"text\": {\"type\": \"plain_text\", \"text\": \"🚨 Pipeline Backend Échouée\", \"emoji\": true}
            },
            {
              \"type\": \"section\",
              \"fields\": [
                {\"type\": \"mrkdwn\", \"text\": \"*Étape échouée:*\n\`$FAILED_STAGE\`\"},
                {\"type\": \"mrkdwn\", \"text\": \"*Job:*\n\`$FAILED_JOB\`\"},
                {\"type\": \"mrkdwn\", \"text\": \"*Branche:*\n\`$CI_COMMIT_REF_NAME\`\"},
                {\"type\": \"mrkdwn\", \"text\": \"*Auteur:*\n$GITLAB_USER_NAME\"}
              ]
            },
            {
              \"type\": \"section\",
              \"text\": {\"type\": \"mrkdwn\", \"text\": \"📝 _${CI_COMMIT_TITLE}_\"}
            },
            {
              \"type\": \"actions\",
              \"elements\": [
                {\"type\": \"button\", \"text\": {\"type\": \"plain_text\", \"text\": \"🔴 Voir l'erreur\"}, \"style\": \"danger\", \"url\": \"$CI_PROJECT_URL/-/pipelines/$CI_PIPELINE_ID\"},
                {\"type\": \"button\", \"text\": {\"type\": \"plain_text\", \"text\": \"📋 Logs\"}, \"url\": \"$CI_PROJECT_URL/-/pipelines/$CI_PIPELINE_ID/failures\"}
              ]
            }
          ]
        }]
      }" "$WEBHOOK"
  when: on_failure
  rules:
    - if: $CI_COMMIT_BRANCH

# --- ETAPE 6 : NETTOYAGE INTELLIGENT ---
cleanup:
  stage: cleanup
  script:
    - |
      echo "🧹 Starting cleanup..."

      # 1. CI image policy:
      #    - main/preprod  → conservée (pushée au registry + sert de cache pour le prochain pipeline)
      #    - feature branch → supprimée du runner local (jamais pushée, cache-from utilise ci:main)
      #      Sans ça, chaque feature branch laisserait un fantôme de ~1.4 GB sur le runner.
      if [ "$CI_COMMIT_BRANCH" != "main" ] && [ "$CI_COMMIT_BRANCH" != "preprod" ]; then
        if docker image inspect $CI_IMAGE >/dev/null 2>&1; then
          docker rmi $CI_IMAGE 2>/dev/null || true
          echo "  ✓ Removed local feature-branch CI image ($CI_IMAGE)"
        fi
      fi

      # 2. Nettoyer les images dangling (sans tag)
      DANGLING=$(docker images -f "dangling=true" -q 2>/dev/null | wc -l | tr -d ' ')
      if [ "$DANGLING" -gt 0 ]; then
        docker rmi $(docker images -f "dangling=true" -q) 2>/dev/null || true
        echo "  ✓ Removed $DANGLING dangling images"
      fi

      # 3. Nettoyer les containers arrêtés depuis plus de 1h
      STOPPED=$(docker ps -a -f "status=exited" --format '{{.ID}}' 2>/dev/null | wc -l | tr -d ' ')
      if [ "$STOPPED" -gt 0 ]; then
        docker container prune -f --filter "until=1h" 2>/dev/null
        echo "  ✓ Cleaned stopped containers"
      fi

      # 4. Nettoyer les networks orphelins (sauf ceux en cours d'utilisation)
      docker network prune -f --filter "until=1h" 2>/dev/null || true
      echo "  ✓ Cleaned unused networks"

      # 5. Nettoyer les volumes orphelins (attention: pas les données!)
      # docker volume prune -f --filter "label!=keep" 2>/dev/null || true

      # 6. Nettoyer le build cache Docker (garde 10GB)
      docker builder prune -f --keep-storage=10GB 2>/dev/null || true
      echo "  ✓ Cleaned build cache (keeping 10GB)"

      # 7. Rapport final
      echo ""
      echo "📊 Disk usage after cleanup:"
      docker system df 2>/dev/null || true
  when: always
  rules:
    - if: $CI_COMMIT_BRANCH
