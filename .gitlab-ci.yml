stages:
  - prepare
  - quality
  - build_and_test # Build + Test en parallèle
  - deploy
  - smoke_test # Vérification post-déploiement
  - notify
  - cleanup

workflow:
  rules:
    - if: $CI_COMMIT_TITLE =~ /\[skip ci\]/i
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  APP_IMAGE: $CI_REGISTRY_IMAGE/app
  IMAGE_TAG: $CI_COMMIT_REF_SLUG
  CI_IMAGE: $CI_REGISTRY_IMAGE/ci:$CI_COMMIT_REF_SLUG

default:
  tags:
    - self-hosted-shell
  interruptible: true
  # Hook exécuté AVANT `git fetch/checkout` (GitLab 15.10+). On nettoie les
  # reliquats root-owned (ex: ancien .trivycache) que le runner shell ne peut
  # pas supprimer lui-même. Docker tourne en root → peut tout effacer.
  # No-op une fois le workspace propre.
  hooks:
    pre_get_sources_script:
      - |
        if [ -d "$CI_PROJECT_DIR/.trivycache" ]; then
          echo "🧹 Cleaning stale root-owned .trivycache/ from previous runs..."
          docker run --rm -v "$CI_PROJECT_DIR:/w" alpine:3 rm -rf /w/.trivycache || true
        fi
  before_script:
    # Centralisation de l'authentification Docker
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER"
      --password-stdin "$CI_REGISTRY"

# --- ETAPE 0 : BUILD IMAGE CI (une seule fois) ---
# The CI image contains ONLY PHP extensions + Composer + installed vendor deps.
# It does NOT include the application code, so `composer install` is only
# re-run when composer.lock changes — not on every commit.
prepare_ci_image:
  stage: prepare
  script:
    - |
      docker pull $CI_IMAGE || true
      docker build --cache-from $CI_IMAGE -t $CI_IMAGE -f - . <<'DOCKERFILE'
      FROM php:8.4-cli-alpine
      RUN apk add --no-cache git libzip-dev icu-dev postgresql-dev libpng-dev oniguruma-dev gettext-dev freetype-dev libjpeg-turbo-dev libwebp-dev $PHPIZE_DEPS \
        && docker-php-ext-configure gd --with-freetype --with-jpeg --with-webp \
        && docker-php-ext-install bcmath intl pdo_pgsql mbstring zip gd exif gettext \
        && pecl install redis && docker-php-ext-enable redis \
        && apk del $PHPIZE_DEPS && rm -rf /tmp/*
      COPY --from=composer:latest /usr/bin/composer /usr/bin/composer
      WORKDIR /app
      # Layer 1: install deps (cached until composer.lock changes)
      COPY composer.json composer.lock ./
      RUN mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache \
        && touch .env \
        && composer install --no-interaction --no-ansi --no-scripts -q
      # Layer 2: copy code (fast, does not re-run composer install)
      COPY . .
      DOCKERFILE
      docker push $CI_IMAGE || true
  retry:
    max: 2
    when: runner_system_failure
  rules:
    - if: $CI_COMMIT_BRANCH

# --- ETAPE 1 : QUALITY (tous en parallele) ---
phpstan:
  stage: quality
  needs: [ prepare_ci_image ]
  script:
    - docker run --rm -e APP_KEY="base64:$(openssl rand -base64 32)" $CI_IMAGE
      ./vendor/bin/phpstan analyse --memory-limit=512M
  rules:
    # Toujours bloquant sur les branches de déploiement, même si le commit ne touche que YAML/docs.
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "preprod"
    - if: $CI_COMMIT_BRANCH
      changes:
        - "**/*.php"

style_check:
  stage: quality
  needs: [ prepare_ci_image ]
  script:
    - docker run --rm $CI_IMAGE ./vendor/bin/pint --test
  rules:
    # Toujours bloquant sur les branches de déploiement, même si le commit ne touche que YAML/docs.
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "preprod"
    - if: $CI_COMMIT_BRANCH
      changes:
        - "**/*.php"

composer_security:
  stage: quality
  needs: [ prepare_ci_image ]
  script:
    - docker run --rm $CI_IMAGE composer audit --abandoned=ignore
  rules:
    - if: $CI_COMMIT_BRANCH

# Rector — automated refactor checks. Runs in --dry-run so it never modifies CI;
# fails the job if there are unapplied automatic upgrades / fixes that should be
# committed before merge.
rector:
  stage: quality
  needs: [ prepare_ci_image ]
  allow_failure: true # advisory in CI: do not block the pipeline (yet) — see AGENTS.md
  script:
    - docker run --rm $CI_IMAGE ./vendor/bin/rector process --dry-run
      --no-progress-bar
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - "**/*.php"
        - rector.php

# --- ETAPE 2 : BUILD & PUSH (en parallèle avec tests) ---
#
# Stratégie de tags (rollback-friendly) :
#   $APP_IMAGE:$CI_COMMIT_SHA   → IMMUTABLE  (40 chars, source de vérité pour deploy/rollback)
#   $APP_IMAGE:$IMAGE_TAG       → mouvant    ($CI_COMMIT_REF_SLUG, ex. "main", "preprod")
#   $APP_IMAGE:latest           → mouvant    (alias historique, push uniquement sur main)
#
# Le tag SHA permet de rollback vers n'importe quel commit précédemment déployé :
#   docker pull $APP_IMAGE:abcdef1234567890abcdef1234567890abcdef12
#   APP_IMAGE=$APP_IMAGE:abcdef… docker compose up -d --no-build
build_image:
  stage: build_and_test
  variables:
    DOCKER_BUILDKIT: "1"
  needs:
    # Quality gates BLOQUANTS pour main/preprod (rules au-dessus garantissent qu'ils tournent).
    - job: phpstan
    - job: style_check
    - job: composer_security
  script:
    # Pull the previous image to use as a cache source — dramatically speeds up
    # builds when only code (not dependencies) changed.
    - docker pull $APP_IMAGE:latest || true
    - docker build --cache-from $APP_IMAGE:latest -t $APP_IMAGE:$CI_COMMIT_SHA
      -t $APP_IMAGE:$IMAGE_TAG .
    # Push immutable SHA tag FIRST (source of truth for deploy/rollback).
    - docker push $APP_IMAGE:$CI_COMMIT_SHA
    # Then the mutable branch alias (for backwards compat with older tooling).
    - docker push $APP_IMAGE:$IMAGE_TAG
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag $APP_IMAGE:$CI_COMMIT_SHA $APP_IMAGE:latest
        docker push $APP_IMAGE:latest
      fi
  after_script:
    - docker logout $CI_REGISTRY 2>/dev/null || true
  retry:
    max: 2
    when: runner_system_failure
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "preprod"

# --- ETAPE 2 : TESTS (en parallèle avec build) ---
test_suite:
  stage: build_and_test
  needs: [ prepare_ci_image ]
  timeout: 10 minutes
  retry:
    max: 2
    when: runner_system_failure
  script:
    - |
      # Create isolated network for this job
      docker network create ci-net-$CI_JOB_ID

      # Start PostgreSQL with PostGIS
      docker run -d \
        --name pg-$CI_JOB_ID \
        --network ci-net-$CI_JOB_ID \
        -e POSTGRES_DB=testing \
        -e POSTGRES_USER=gitlab \
        -e POSTGRES_PASSWORD=test_pass \
        postgis/postgis:15-3.3-alpine

      # Wait until PostgreSQL accepts TCP connections (not just Unix socket).
      # pg_isready without -h checks /var/run/postgresql (Unix socket) which
      # becomes ready before TCP is bound — causing cross-container ECONNREFUSED.
      echo "Waiting for PostgreSQL..."
      for i in $(seq 1 30); do
        docker exec pg-$CI_JOB_ID pg_isready -U gitlab -h 127.0.0.1 -p 5432 && break
        [ "$i" = "30" ] && echo "PostgreSQL failed to start" && exit 1
        sleep 2
      done

      # Run test suite inside CI image
      docker run --rm \
        --network ci-net-$CI_JOB_ID \
        -e DB_CONNECTION=pgsql \
        -e DB_HOST=pg-$CI_JOB_ID \
        -e DB_PORT=5432 \
        -e DB_DATABASE=testing \
        -e DB_USERNAME=gitlab \
        -e DB_PASSWORD=test_pass \
        -e SCOUT_DRIVER=null \
        $CI_IMAGE sh -c \
        'set -e
        cp .env.example .env
        cp .env.example .env.testing
        rm -f database/data/cities.sql
        php artisan key:generate --env=testing
        php artisan migrate --env=testing --force
        echo "=== RUNNING TESTS ==="
        set +e
        php artisan test --env=testing -v 2>&1
        TEST_RC=$?
        echo "=== TESTS FINISHED WITH RC=$TEST_RC ==="
        exit $TEST_RC'
  after_script:
    - docker rm -f pg-$CI_JOB_ID 2>/dev/null || true
    - docker network rm ci-net-$CI_JOB_ID 2>/dev/null || true
  rules:
    - if: $CI_COMMIT_BRANCH

# ── ETAPE 2.5 : SECURITE IMAGE (Trivy + SBOM) ──────────────────────────────────
#
# Trivy scanne l'image Docker construite pour :
#   - CVE OS (Alpine packages)
#   - CVE applicatives (PHP extensions, composer libs déjà installées dans /var/www/vendor)
#   - Misconfigurations Dockerfile (USER root, secrets en cleartext, etc.)
#
# `--exit-code 1` rend le job bloquant si CRITICAL/HIGH trouvée. Pour la première
# montée en charge, garder `allow_failure: true` afin de ne pas bloquer un deploy
# pendant qu'on traite la backlog (audit puis fix progressif). À retirer ensuite.
trivy_scan:
  stage: build_and_test
  needs: [ build_image ]
  allow_failure: true
  variables:
    # IMPORTANT : cache HORS du workspace pour éviter les conflits de permission
    # avec git checkout (les fichiers créés par le conteneur appartiennent à root,
    # le runner shell n'arrive pas à les nettoyer au prochain run).
    # La DB Trivy (~50 MB) sera re-téléchargée à chaque run (~5s, négligeable).
    TRIVY_NO_PROGRESS: "true"
  script:
    - |
      IMAGE_REF="$APP_IMAGE:$CI_COMMIT_SHA"
      TRIVY_CACHE_HOST="/tmp/trivy-cache-${CI_PROJECT_ID}-${CI_JOB_ID}"
      mkdir -p "$TRIVY_CACHE_HOST"
      echo "🔍 Scanning $IMAGE_REF for CRITICAL/HIGH CVEs..."
      docker run --rm \
        --user "$(id -u):$(id -g)" \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v "$TRIVY_CACHE_HOST:/.cache" \
        -e TRIVY_CACHE_DIR=/.cache/trivy \
        aquasec/trivy:latest image \
          --severity CRITICAL,HIGH \
          --ignore-unfixed \
          --exit-code 1 \
          --format table \
          "$IMAGE_REF"
  after_script:
    - rm -rf "/tmp/trivy-cache-${CI_PROJECT_ID}-${CI_JOB_ID}" 2>/dev/null || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "preprod"

# ── SBOM : Software Bill of Materials (SPDX-JSON via Syft) ───────────────────
# Liste exhaustive de chaque paquet OS + composer + node compilé dans l'image.
# Indispensable pour audit SOC2/ISO 27001 et traçabilité supply-chain.
# Stocké comme artifact GitLab (rétention 90 jours).
sbom_syft:
  stage: build_and_test
  needs: [ build_image ]
  allow_failure: true
  script:
    - |
      IMAGE_REF="$APP_IMAGE:$CI_COMMIT_SHA"
      echo "📦 Generating SBOM for $IMAGE_REF..."
      docker run --rm \
        --user "$(id -u):$(id -g)" \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v "$PWD:/work" -w /work \
        anchore/syft:latest \
          "$IMAGE_REF" \
          -o spdx-json=sbom-${CI_COMMIT_SHORT_SHA}.spdx.json \
          -o cyclonedx-json=sbom-${CI_COMMIT_SHORT_SHA}.cdx.json
      ls -la sbom-*.json
  artifacts:
    name: "sbom-${CI_COMMIT_SHORT_SHA}"
    paths:
      - sbom-*.spdx.json
      - sbom-*.cdx.json
    expire_in: 90 days
    when: on_success
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "preprod"

# ── Shared deploy template ─────────────────────────────────────────────────────
# All differences between prod and preprod are expressed as job-level variables:
#   DEPLOY_DIR          – root dir on the VPS (/opt/keyhome or /opt/keyhome-preprod)
#   DEPLOY_BRANCH       – git branch to deploy (main / preprod)
#   COMPOSE_SRC_FILE    – compose file to copy (docker-compose.yml / docker-compose.preprod.yml)
#   COMPOSE_FALLBACK    – fallback container-name prefix if COMPOSE_PREFIX not set in .env
#   REQUIRE_ENV_CHECK   – "true" to abort when .env is missing (preprod only)
#   REQUIRE_NETWORK_CHECK – "true" to abort when the shared prod network is absent (preprod only)
.deploy_template: &deploy_template
  stage: deploy
  needs: [ build_image, test_suite ]
  timeout: 15 minutes
  interruptible: false
  script:
    # ── Copy compose file + nginx config ───────────────────────────────────────
    - mkdir -p $DEPLOY_DIR/.docker/nginx/conf.d
    - cp $COMPOSE_SRC_FILE $DEPLOY_DIR/docker-compose.yml
    - cp -rf .docker/nginx/conf.d/. $DEPLOY_DIR/.docker/nginx/conf.d/
    # ── Sync codebase to VPS for reference and manual artisan commands ─────────
    - |
      AUTHENTICATED_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
      if [ -d $DEPLOY_DIR/codebase/.git ]; then
        cd $DEPLOY_DIR/codebase
        git remote set-url origin "$AUTHENTICATED_URL"
        git fetch origin $DEPLOY_BRANCH && git reset --hard origin/$DEPLOY_BRANCH
      else
        git clone --depth 1 --branch $DEPLOY_BRANCH "$AUTHENTICATED_URL" $DEPLOY_DIR/codebase
      fi
    # ── Optional .env guard (preprod only: REQUIRE_ENV_CHECK=true) ─────────────
    - |
      if [ "${REQUIRE_ENV_CHECK}" = "true" ] && [ ! -f "$DEPLOY_DIR/.env" ]; then
        echo "❌ $DEPLOY_DIR/.env n'existe pas."
        echo "   Créez-le à partir de .env.preprod.example avant le premier déploiement."
        echo "   Variables critiques : COMPOSE_PREFIX=keyhome-preprod, WEB_PORT=9091, DB_HOST=keyhome-db"
        exit 1
      fi
    # ── Optional network guard (preprod shares prod infra: REQUIRE_NETWORK_CHECK=true) ──
    - |
      if [ "${REQUIRE_NETWORK_CHECK}" = "true" ] && ! docker network inspect keyhome_keyhome-network > /dev/null 2>&1; then
        echo "❌ Le réseau 'keyhome_keyhome-network' n'existe pas. Assurez-vous que l'environnement de production est démarré."
        exit 1
      fi
    - cd $DEPLOY_DIR || exit 1
    # Déploiement par SHA immutable (et non par tag de branche) → rollback fiable.
    - export FULL_IMAGE="${CI_REGISTRY_IMAGE}/app:${CI_COMMIT_SHA}"
    - echo "🚀 Deploying image $FULL_IMAGE"
    # Persiste le SHA déployé dans un fichier sur le VPS pour audit/rollback rapide.
    - echo "$CI_COMMIT_SHA" > $DEPLOY_DIR/.last-deployed-sha
    - echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $CI_COMMIT_SHA
      $CI_COMMIT_REF_NAME" >> $DEPLOY_DIR/.deploy-history
    # ── Save current image for rollback in case migrations fail ────────────────
    - |
      ROLLBACK_IMAGE=$(docker inspect --format='{{.Config.Image}}' ${COMPOSE_PREFIX:-$COMPOSE_FALLBACK}-backend 2>/dev/null || echo "")
      echo "📌 Rollback point: ${ROLLBACK_IMAGE:-none (first deploy)}"
    # Enable maintenance mode before deploy
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan
      down --retry=60 || true
    - echo "📥 Pulling new image..."
    - APP_IMAGE=$FULL_IMAGE docker compose pull
    - echo "🔄 Starting containers..."
    - APP_IMAGE=$FULL_IMAGE docker compose up -d --no-build --remove-orphans
    # ── Wait for app container to be healthy ───────────────────────────────────
    - |
      echo "⏳ Waiting for containers to be ready..."
      for i in $(seq 1 60); do
        if APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan list > /dev/null 2>&1; then
          echo "✅ App container is ready"
          break
        fi
        if [ "$i" = "60" ]; then
          echo "❌ App container failed to start"
          APP_IMAGE=$FULL_IMAGE docker compose logs app --tail=50
          APP_IMAGE=$FULL_IMAGE docker compose ps -a
          exit 1
        fi
        sleep 2
      done
    # Nginx can cache the old app container IP after app is recreated — refresh web after app is up.
    - echo "🔄 Recreating web (nginx) so FastCGI targets the current
      app container..."
    - APP_IMAGE=$FULL_IMAGE docker compose up -d --no-build --no-deps
      --force-recreate web
    # ── Run migrations with automatic rollback on failure ──────────────────────
    - |
      echo "🗾 Running migrations..."
      if ! APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan migrate --force; then
        echo "❌ Migration failed — rolling back to previous image..."
        APP_IMAGE=$FULL_IMAGE docker compose logs app --tail=30
        if [ -n "$ROLLBACK_IMAGE" ]; then
          echo "🔄 Restoring $ROLLBACK_IMAGE ..."
          APP_IMAGE=$ROLLBACK_IMAGE docker compose up -d --no-build --remove-orphans || true
          APP_IMAGE=$ROLLBACK_IMAGE docker compose exec -T app php artisan up || true
          echo "✅ Rolled back to previous image"
        else
          APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan up || true
        fi
        exit 1
      fi
    # ── Runtime cache rebuild (needs real .env — cannot be done in Docker build) ──
    - echo "🧹 Clearing stale caches..."
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan optimize:clear
    - echo "⚡ Rebuilding runtime caches..."
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app bash
      resetFilamentLivewire.sh
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan optimize
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan
      storage:link || true
    # ── Meilisearch: sync settings then full reindex ───────────────────────────
    - echo "🔍 Syncing Meilisearch index settings..."
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan
      scout:sync-index-settings || true
    # Disable maintenance mode
    - echo "✅ Deployment complete, bringing app back up..."
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan up
    # ── Non-blocking post-deploy tasks (run after app is live) ─────────────────
    # NOTE: Full `scout:import` is intentionally NOT run here — it scans every Ad
    # row and degrades deploy time linearly with catalog size. Reindex is now
    # triggered by Eloquent observers (HasMedia / Searchable) on writes, plus a
    # nightly `php artisan scout:import App\\Models\\Ad` cron for drift recovery
    # (see AGENTS.md scaling section). This is also safer for blue/green deploys.
    - echo "📄 Generating Swagger docs (non-blocking)..."
    - APP_IMAGE=$FULL_IMAGE docker compose exec -T app php artisan
      l5-swagger:generate || true
  after_script:
    - docker logout $CI_REGISTRY 2>/dev/null || true

# --- ETAPE 3 : DEPLOIEMENT ---
production_deploy:
  <<: *deploy_template
  variables:
    DEPLOY_DIR: /opt/keyhome
    DEPLOY_BRANCH: main
    COMPOSE_SRC_FILE: docker-compose.yml
    COMPOSE_FALLBACK: keyhome-prod
    REQUIRE_ENV_CHECK: "false"
    REQUIRE_NETWORK_CHECK: "false"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# --- DEPLOIEMENT PREPROD ---
preprod_deploy:
  <<: *deploy_template
  variables:
    DEPLOY_DIR: /opt/keyhome-preprod
    DEPLOY_BRANCH: preprod
    COMPOSE_SRC_FILE: docker-compose.preprod.yml
    COMPOSE_FALLBACK: keyhome-preprod
    REQUIRE_ENV_CHECK: "true"
    REQUIRE_NETWORK_CHECK: "true"
  rules:
    - if: $CI_COMMIT_BRANCH == "preprod"

# --- ETAPE 4 : SMOKE TEST ---
production_smoke_test:
  stage: smoke_test
  needs: [ production_deploy ]
  script:
    - echo "Running comprehensive smoke tests on production..."
    - |
      # PROD_API_URL must be set in GitLab CI/CD Variables (e.g. https://api.keyhome.app)
      SMOKE_URL="${PROD_API_URL:-https://api.keyhome.app}"
      AUTH_HEADER=""
      if [ -n "${HEALTH_CHECK_TOKEN:-}" ]; then
        AUTH_HEADER="Authorization: Bearer ${HEALTH_CHECK_TOKEN}"
      fi
      echo "Smoke URL: $SMOKE_URL"
      set +e

      # 1° Liveness rapide (TCP + 200) avant le check approfondi.
      for i in $(seq 1 10); do
        STATUS=$(curl --globoff --silent --output /dev/null --write-out "%{http_code}" "${SMOKE_URL}/api/ping" 2>/dev/null)
        echo "[liveness] attempt $i — HTTP $STATUS"
        if [ "$STATUS" = "200" ]; then break; fi
        [ "$i" = "10" ] && echo "❌ Liveness failed" && exit 1
        sleep 3
      done

      # 2° Readiness profond : DB + Redis + Queue + Storage + Meilisearch + Flutterwave.
      # /api/health renvoie 200 si healthy, 503 si degraded/unhealthy. force=true bypass le cache 30s.
      RESPONSE=$(curl --globoff --silent --max-time 15 \
        ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
        "${SMOKE_URL}/api/health?force=true" 2>/dev/null || echo '{"status":"unreachable"}')
      echo "[readiness] /api/health response:"
      echo "$RESPONSE" | head -c 800
      echo

      # Extraction du statut global (sans jq).
      STATUS_LINE=$(echo "$RESPONSE" | grep -o '"status":"[a-z]*"' | head -1 | sed 's/"status":"//;s/"//')
      case "$STATUS_LINE" in
        healthy)
          echo "✅ Production fully healthy."
          exit 0
          ;;
        degraded)
          echo "⚠️  Production is DEGRADED — deploy réussi mais services secondaires en panne."
          echo "   Voir le contenu ci-dessus pour identifier le check qui échoue."
          # On considère le deploy OK : DB + cache + storage critiques sont up.
          # Les checks non-critiques (Meilisearch, Flutterwave) peuvent être transients.
          exit 0
          ;;
        unhealthy|unreachable|"")
          echo "❌ Production is UNHEALTHY — abort."
          exit 1
          ;;
        *)
          echo "❌ Statut /api/health inattendu: $STATUS_LINE"
          exit 1
          ;;
      esac
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

preprod_smoke_test:
  stage: smoke_test
  needs: [ preprod_deploy ]
  script:
    - echo "Running smoke tests on preproduction..."
    - |
      set +e
      PREPROD_PORT=$(grep -E "^WEB_PORT=" /opt/keyhome-preprod/.env 2>/dev/null | cut -d= -f2 | tr -d "[:space:]'\"" )
      PREPROD_PORT=${PREPROD_PORT:-9091}
      FULL_IMAGE="${CI_REGISTRY_IMAGE}/app:${CI_COMMIT_SHA}"
      echo "Using port: $PREPROD_PORT"
      # 1° Liveness
      for i in $(seq 1 15); do
        STATUS=$(curl --globoff --silent --output /dev/null --write-out "%{http_code}" "http://127.0.0.1:${PREPROD_PORT}/api/ping" 2>/dev/null)
        echo "[liveness] attempt $i — HTTP $STATUS (GET /api/ping)"
        if [ "$STATUS" = "200" ]; then break; fi
        [ "$i" = "15" ] && echo "❌ Liveness failed" && break
        sleep 5
      done

      # 2° Readiness profond : DB + Redis + Queue + Storage + Meilisearch + Flutterwave.
      AUTH_HEADER=""
      if [ -n "${HEALTH_CHECK_TOKEN:-}" ]; then
        AUTH_HEADER="Authorization: Bearer ${HEALTH_CHECK_TOKEN}"
      fi
      RESPONSE=$(curl --globoff --silent --max-time 15 \
        ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
        "http://127.0.0.1:${PREPROD_PORT}/api/health?force=true" 2>/dev/null || echo '{"status":"unreachable"}')
      echo "[readiness] /api/health response:"
      echo "$RESPONSE" | head -c 800
      echo
      STATUS_LINE=$(echo "$RESPONSE" | grep -o '"status":"[a-z]*"' | head -1 | sed 's/"status":"//;s/"//')
      case "$STATUS_LINE" in
        healthy)   echo "✅ Preproduction healthy."; exit 0 ;;
        degraded)  echo "⚠️  Preproduction degraded — deploy OK, services secondaires dégradés."; exit 0 ;;
      esac
      echo "❌ Preproduction smoke test failed (status=$STATUS_LINE)"
      echo "--- docker compose ps ---"
      cd /opt/keyhome-preprod && APP_IMAGE=$FULL_IMAGE docker compose ps -a || true
      echo "--- docker compose logs (web, app) ---"
      cd /opt/keyhome-preprod && APP_IMAGE=$FULL_IMAGE docker compose logs web app --tail=120 || true
      echo "--- curl -v /up (last 40 lines) ---"
      curl --globoff -v --max-time 15 "http://127.0.0.1:${PREPROD_PORT}/up" 2>&1 | tail -40 || true
      exit 1
  rules:
    - if: $CI_COMMIT_BRANCH == "preprod"

# --- ETAPE 5 : NOTIFICATION E-MAIL (SMTP via curl) ---
#
# Réutilise les credentials Laravel MAIL_* déjà configurés en variables
# GitLab (Settings → CI/CD → Variables). Requiert :
#   MAIL_HOST            ex. smtp.mailgun.org
#   MAIL_PORT            465 (SMTPS) ou 587 (STARTTLS)
#   MAIL_USERNAME        login SMTP
#   MAIL_PASSWORD        password SMTP (masked)
#   MAIL_FROM_ADDRESS    ex. no-reply@keyhome.app
#   MAIL_FROM_NAME       ex. "KeyHome CI"           (optionnel)
#   NOTIFY_EMAIL_TO      destinataire unique        (fallback : dev@keyhome.app)
#
# Curl sait parler SMTP nativement : aucune dépendance supplémentaire
# n'est installée sur le runner `self-hosted-shell`.

.email_notify_base: &email_notify_base
  stage: notify
  allow_failure: true
  variables:
    NOTIFY_EMAIL_TO: $NOTIFY_EMAIL_TO
  before_script:
    - |
      # Le before_script par défaut fait `docker login`; on le neutralise ici
      # car les jobs de notification n'ont pas besoin du registry.
      echo "📧 Préparation notification e-mail"

email_success:
  <<: *email_notify_base
  needs:
    - job: production_smoke_test
      optional: true
    - job: preprod_smoke_test
      optional: true
    - job: production_deploy
      optional: true
    - job: preprod_deploy
      optional: true
  script:
    - |
      set -eu
      : "${NOTIFY_EMAIL_TO:=dev@keyhome.app}"
      : "${MAIL_FROM_NAME:=KeyHome CI}"

      if [ -z "${MAIL_HOST:-}" ] || [ -z "${MAIL_PORT:-}" ] || [ -z "${MAIL_USERNAME:-}" ] || [ -z "${MAIL_PASSWORD:-}" ] || [ -z "${MAIL_FROM_ADDRESS:-}" ]; then
        echo "⚠️  Variables SMTP absentes (MAIL_HOST/PORT/USERNAME/PASSWORD/FROM_ADDRESS) — notification skippée."
        exit 0
      fi

      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        DEPLOY_ENV="Production"
        ENV_COLOR="#16a34a"
      else
        DEPLOY_ENV="Preproduction"
        ENV_COLOR="#2563eb"
      fi

      SHORT_SHA="${CI_COMMIT_SHA:0:8}"
      SUBJECT="✅ Déploiement ${DEPLOY_ENV} réussi — ${CI_PROJECT_NAME} (${SHORT_SHA})"
      PIPELINE_URL="${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID}"
      COMMIT_URL="${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA}"
      NOW_UTC=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

      # Déterminer le port/TLS
      if [ "$MAIL_PORT" = "465" ]; then
        SMTP_URL="smtps://${MAIL_HOST}:${MAIL_PORT}"
      else
        SMTP_URL="smtp://${MAIL_HOST}:${MAIL_PORT}"
      fi

      BOUNDARY="kh-ci-$(date +%s)-$$"
      EMAIL_FILE="$(mktemp)"

      # Corps HTML — structure responsive, CSS inline, brand #F6475F
      # (lues par Gmail/Outlook/Apple Mail sans surprise).
      HTML_BODY=$(cat <<HTML
      <!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${SUBJECT}</title></head>
      <body style="margin:0;padding:0;background:#f1f5f9;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#0f172a;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f1f5f9;padding:24px 12px;">
        <tr><td align="center">
          <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(15,23,42,0.08);">
            <tr><td style="background:#16a34a;padding:28px 32px;color:#ffffff;">
              <div style="font-size:12px;letter-spacing:2px;font-weight:700;opacity:0.9;">KEYHOME CI · DÉPLOIEMENT</div>
              <div style="font-size:24px;font-weight:800;margin-top:6px;">✅ ${DEPLOY_ENV} — déploiement réussi</div>
              <div style="font-size:14px;margin-top:6px;opacity:0.95;">Pipeline #${CI_PIPELINE_ID} · ${CI_PROJECT_NAME}</div>
            </td></tr>
            <tr><td style="padding:28px 32px 8px 32px;">
              <p style="margin:0 0 16px 0;font-size:15px;line-height:1.55;color:#334155;">
                La branche <strong style="color:#0f172a;">${CI_COMMIT_REF_NAME}</strong> a été déployée avec succès sur
                <strong style="color:${ENV_COLOR};">${DEPLOY_ENV}</strong> et a passé les smoke tests.
              </p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border:1px solid #e2e8f0;border-radius:8px;margin-bottom:20px;">
                <tr><td style="padding:10px 14px;background:#f8fafc;font-size:11px;letter-spacing:1.5px;color:#64748b;font-weight:700;border-bottom:1px solid #e2e8f0;">RÉSUMÉ</td></tr>
                <tr><td style="padding:4px 14px 12px 14px;">
                  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                    <tr><td style="padding:8px 0;font-size:13px;color:#64748b;width:40%;">Environnement</td><td style="padding:8px 0;font-size:14px;color:#0f172a;font-weight:600;">${DEPLOY_ENV}</td></tr>
                    <tr><td style="padding:8px 0;font-size:13px;color:#64748b;border-top:1px solid #f1f5f9;">Branche</td><td style="padding:8px 0;font-size:14px;color:#0f172a;font-weight:600;border-top:1px solid #f1f5f9;"><code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:13px;">${CI_COMMIT_REF_NAME}</code></td></tr>
                    <tr><td style="padding:8px 0;font-size:13px;color:#64748b;border-top:1px solid #f1f5f9;">Commit</td><td style="padding:8px 0;font-size:14px;color:#0f172a;font-weight:600;border-top:1px solid #f1f5f9;"><a href="${COMMIT_URL}" style="color:#F6475F;text-decoration:none;font-family:ui-monospace,monospace;">${SHORT_SHA}</a></td></tr>
                    <tr><td style="padding:8px 0;font-size:13px;color:#64748b;border-top:1px solid #f1f5f9;">Message</td><td style="padding:8px 0;font-size:14px;color:#0f172a;border-top:1px solid #f1f5f9;">${CI_COMMIT_TITLE}</td></tr>
                    <tr><td style="padding:8px 0;font-size:13px;color:#64748b;border-top:1px solid #f1f5f9;">Auteur</td><td style="padding:8px 0;font-size:14px;color:#0f172a;border-top:1px solid #f1f5f9;">${GITLAB_USER_NAME} &lt;${GITLAB_USER_EMAIL:-n/a}&gt;</td></tr>
                    <tr><td style="padding:8px 0;font-size:13px;color:#64748b;border-top:1px solid #f1f5f9;">Horodatage</td><td style="padding:8px 0;font-size:14px;color:#0f172a;border-top:1px solid #f1f5f9;">${NOW_UTC}</td></tr>
                  </table>
                </td></tr>
              </table>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border:1px solid #dcfce7;background:#f0fdf4;border-radius:8px;margin-bottom:20px;">
                <tr><td style="padding:14px 16px;">
                  <div style="font-size:12px;letter-spacing:1.5px;color:#15803d;font-weight:700;margin-bottom:8px;">ÉTAPES VALIDÉES</div>
                  <ul style="margin:0;padding-left:18px;font-size:14px;color:#166534;line-height:1.8;">
                    <li>Quality checks (PHPStan · Pint)</li>
                    <li>Test suite (Pest)</li>
                    <li>Build &amp; déploiement vers <strong>${DEPLOY_ENV}</strong></li>
                    <li>Smoke tests post-déploiement</li>
                  </ul>
                </td></tr>
              </table>
              <div style="text-align:center;padding:8px 0 20px 0;">
                <a href="${PIPELINE_URL}" style="display:inline-block;background:#0f172a;color:#ffffff;text-decoration:none;padding:12px 28px;border-radius:8px;font-weight:700;font-size:14px;">Voir la pipeline →</a>
              </div>
            </td></tr>
            <tr><td style="background:#f8fafc;padding:16px 32px;border-top:1px solid #e2e8f0;font-size:12px;color:#94a3b8;text-align:center;">
              KeyHome CI · notification automatique · ne pas répondre à ce message
            </td></tr>
          </table>
        </td></tr>
      </table>
      </body></html>
      HTML
      )

      # Corps texte brut fallback (clients anciens / no-HTML).
      TEXT_BODY=$(cat <<TXT
      ✅ DÉPLOIEMENT ${DEPLOY_ENV} RÉUSSI — ${CI_PROJECT_NAME}

      Branche     : ${CI_COMMIT_REF_NAME}
      Commit      : ${SHORT_SHA} — ${CI_COMMIT_TITLE}
      Auteur      : ${GITLAB_USER_NAME}
      Horodatage  : ${NOW_UTC}

      Étapes validées :
        • Quality checks (PHPStan · Pint)
        • Test suite (Pest)
        • Build & déploiement sur ${DEPLOY_ENV}
        • Smoke tests post-déploiement

      Pipeline : ${PIPELINE_URL}
      Commit   : ${COMMIT_URL}

      -- KeyHome CI (notification automatique)
      TXT
      )

      # Construction du message RFC 5322 multipart/alternative (CRLF obligatoires pour SMTP).
      {
        printf 'From: "%s" <%s>\r\n' "$MAIL_FROM_NAME" "$MAIL_FROM_ADDRESS"
        printf 'To: %s\r\n' "$NOTIFY_EMAIL_TO"
        printf 'Subject: %s\r\n' "$SUBJECT"
        printf 'MIME-Version: 1.0\r\n'
        printf 'Content-Type: multipart/alternative; boundary="%s"\r\n' "$BOUNDARY"
        printf 'Date: %s\r\n' "$(date -u -R 2>/dev/null || date -u)"
        printf '\r\n'
        printf -- '--%s\r\n' "$BOUNDARY"
        printf 'Content-Type: text/plain; charset=UTF-8\r\n'
        printf 'Content-Transfer-Encoding: 8bit\r\n\r\n'
        printf '%s\r\n' "$TEXT_BODY"
        printf -- '--%s\r\n' "$BOUNDARY"
        printf 'Content-Type: text/html; charset=UTF-8\r\n'
        printf 'Content-Transfer-Encoding: 8bit\r\n\r\n'
        printf '%s\r\n' "$HTML_BODY"
        printf -- '--%s--\r\n' "$BOUNDARY"
      } > "$EMAIL_FILE"

      echo "📤 Envoi à ${NOTIFY_EMAIL_TO} via ${SMTP_URL}"
      curl --ssl-reqd --url "$SMTP_URL" \
        --mail-from "$MAIL_FROM_ADDRESS" \
        --mail-rcpt "$NOTIFY_EMAIL_TO" \
        --user "${MAIL_USERNAME}:${MAIL_PASSWORD}" \
        --upload-file "$EMAIL_FILE" \
        --silent --show-error --fail

      rm -f "$EMAIL_FILE"
      echo "✅ Notification e-mail envoyée."
  when: on_success
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "preprod"

email_failure:
  <<: *email_notify_base
  needs:
    - job: production_smoke_test
      optional: true
    - job: preprod_smoke_test
      optional: true
    - job: production_deploy
      optional: true
    - job: preprod_deploy
      optional: true
    - job: test_suite
      optional: true
    - job: phpstan
      optional: true
    - job: style_check
      optional: true
  script:
    - |
      set -eu
      : "${NOTIFY_EMAIL_TO:=dev@keyhome.app}"
      : "${MAIL_FROM_NAME:=KeyHome CI}"

      if [ -z "${MAIL_HOST:-}" ] || [ -z "${MAIL_PORT:-}" ] || [ -z "${MAIL_USERNAME:-}" ] || [ -z "${MAIL_PASSWORD:-}" ] || [ -z "${MAIL_FROM_ADDRESS:-}" ]; then
        echo "⚠️  Variables SMTP absentes — notification skippée."
        exit 0
      fi

      SHORT_SHA="${CI_COMMIT_SHA:0:8}"
      PIPELINE_URL="${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID}"
      FAILURES_URL="${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID}/failures"
      COMMIT_URL="${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA}"
      NOW_UTC=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

      # Identifier le premier job failed via l'API GitLab (pas de jq dispo).
      FAILED_JOBS_JSON=$(curl --globoff -sS --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/jobs?scope[]=failed" 2>/dev/null || echo "[]")
      FAILED_JOB=$(echo "$FAILED_JOBS_JSON" | grep -o '"name":"[^"]*"' | head -1 | sed 's/"name":"//;s/"$//')
      FAILED_STAGE=$(echo "$FAILED_JOBS_JSON" | grep -o '"stage":"[^"]*"' | head -1 | sed 's/"stage":"//;s/"$//')
      FAILED_JOB_ID=$(echo "$FAILED_JOBS_JSON" | grep -o '"id":[0-9]*' | head -1 | sed 's/"id"://')
      [ -z "$FAILED_JOB" ] && FAILED_JOB="inconnu"
      [ -z "$FAILED_STAGE" ] && FAILED_STAGE="inconnu"

      if [ -n "$FAILED_JOB_ID" ]; then
        FAILED_JOB_URL="${CI_PROJECT_URL}/-/jobs/${FAILED_JOB_ID}"
      else
        FAILED_JOB_URL="$FAILURES_URL"
      fi

      SUBJECT="🚨 Échec pipeline — ${CI_PROJECT_NAME} — ${FAILED_STAGE}/${FAILED_JOB} (${SHORT_SHA})"

      if [ "$MAIL_PORT" = "465" ]; then
        SMTP_URL="smtps://${MAIL_HOST}:${MAIL_PORT}"
      else
        SMTP_URL="smtp://${MAIL_HOST}:${MAIL_PORT}"
      fi

      BOUNDARY="kh-ci-$(date +%s)-$$"
      EMAIL_FILE="$(mktemp)"

      HTML_BODY=$(cat <<HTML
      <!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${SUBJECT}</title></head>
      <body style="margin:0;padding:0;background:#f1f5f9;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#0f172a;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f1f5f9;padding:24px 12px;">
        <tr><td align="center">
          <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(15,23,42,0.08);">
            <tr><td style="background:#dc2626;padding:28px 32px;color:#ffffff;">
              <div style="font-size:12px;letter-spacing:2px;font-weight:700;opacity:0.9;">KEYHOME CI · ÉCHEC</div>
              <div style="font-size:24px;font-weight:800;margin-top:6px;">🚨 Pipeline échouée</div>
              <div style="font-size:14px;margin-top:6px;opacity:0.95;">Pipeline #${CI_PIPELINE_ID} · ${CI_PROJECT_NAME}</div>
            </td></tr>
            <tr><td style="padding:28px 32px 8px 32px;">
              <p style="margin:0 0 16px 0;font-size:15px;line-height:1.55;color:#334155;">
                Le job <strong style="color:#0f172a;font-family:ui-monospace,monospace;">${FAILED_JOB}</strong>
                de l'étape <strong style="color:#0f172a;font-family:ui-monospace,monospace;">${FAILED_STAGE}</strong>
                a échoué sur la branche <strong style="color:#dc2626;">${CI_COMMIT_REF_NAME}</strong>.
                Le déploiement n'a <strong>pas</strong> été effectué — l'environnement cible reste intact.
              </p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border:1px solid #fecaca;background:#fef2f2;border-radius:8px;margin-bottom:20px;">
                <tr><td style="padding:14px 16px;">
                  <div style="font-size:12px;letter-spacing:1.5px;color:#991b1b;font-weight:700;margin-bottom:8px;">DIAGNOSTIC</div>
                  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                    <tr><td style="padding:6px 0;font-size:13px;color:#7f1d1d;width:40%;">Stage échoué</td><td style="padding:6px 0;font-size:14px;color:#0f172a;font-weight:700;"><code style="background:#fee2e2;padding:2px 6px;border-radius:4px;">${FAILED_STAGE}</code></td></tr>
                    <tr><td style="padding:6px 0;font-size:13px;color:#7f1d1d;">Job échoué</td><td style="padding:6px 0;font-size:14px;color:#0f172a;font-weight:700;"><code style="background:#fee2e2;padding:2px 6px;border-radius:4px;">${FAILED_JOB}</code></td></tr>
                  </table>
                </td></tr>
              </table>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border:1px solid #e2e8f0;border-radius:8px;margin-bottom:20px;">
                <tr><td style="padding:10px 14px;background:#f8fafc;font-size:11px;letter-spacing:1.5px;color:#64748b;font-weight:700;border-bottom:1px solid #e2e8f0;">CONTEXTE</td></tr>
                <tr><td style="padding:4px 14px 12px 14px;">
                  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                    <tr><td style="padding:8px 0;font-size:13px;color:#64748b;width:40%;">Branche</td><td style="padding:8px 0;font-size:14px;color:#0f172a;font-weight:600;"><code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:13px;">${CI_COMMIT_REF_NAME}</code></td></tr>
                    <tr><td style="padding:8px 0;font-size:13px;color:#64748b;border-top:1px solid #f1f5f9;">Commit</td><td style="padding:8px 0;font-size:14px;color:#0f172a;font-weight:600;border-top:1px solid #f1f5f9;"><a href="${COMMIT_URL}" style="color:#F6475F;text-decoration:none;font-family:ui-monospace,monospace;">${SHORT_SHA}</a></td></tr>
                    <tr><td style="padding:8px 0;font-size:13px;color:#64748b;border-top:1px solid #f1f5f9;">Message</td><td style="padding:8px 0;font-size:14px;color:#0f172a;border-top:1px solid #f1f5f9;">${CI_COMMIT_TITLE}</td></tr>
                    <tr><td style="padding:8px 0;font-size:13px;color:#64748b;border-top:1px solid #f1f5f9;">Auteur</td><td style="padding:8px 0;font-size:14px;color:#0f172a;border-top:1px solid #f1f5f9;">${GITLAB_USER_NAME} &lt;${GITLAB_USER_EMAIL:-n/a}&gt;</td></tr>
                    <tr><td style="padding:8px 0;font-size:13px;color:#64748b;border-top:1px solid #f1f5f9;">Horodatage</td><td style="padding:8px 0;font-size:14px;color:#0f172a;border-top:1px solid #f1f5f9;">${NOW_UTC}</td></tr>
                  </table>
                </td></tr>
              </table>
              <div style="text-align:center;padding:8px 0 8px 0;">
                <a href="${FAILED_JOB_URL}" style="display:inline-block;background:#dc2626;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:700;font-size:14px;margin:4px;">Voir les logs du job →</a>
                <a href="${PIPELINE_URL}" style="display:inline-block;background:#0f172a;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:700;font-size:14px;margin:4px;">Pipeline complète →</a>
              </div>
              <p style="margin:16px 0 4px 0;font-size:13px;color:#64748b;text-align:center;">
                Actions suggérées : reproduire localement via <code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;">./tests/quality.sh --fix</code>
                puis re-push, ou <strong>Retry</strong> depuis l'UI si l'échec semble transient.
              </p>
            </td></tr>
            <tr><td style="background:#f8fafc;padding:16px 32px;border-top:1px solid #e2e8f0;font-size:12px;color:#94a3b8;text-align:center;">
              KeyHome CI · notification automatique · ne pas répondre à ce message
            </td></tr>
          </table>
        </td></tr>
      </table>
      </body></html>
      HTML
      )

      TEXT_BODY=$(cat <<TXT
      🚨 ÉCHEC PIPELINE — ${CI_PROJECT_NAME}

      Stage échoué : ${FAILED_STAGE}
      Job échoué   : ${FAILED_JOB}
      Branche      : ${CI_COMMIT_REF_NAME}
      Commit       : ${SHORT_SHA} — ${CI_COMMIT_TITLE}
      Auteur       : ${GITLAB_USER_NAME}
      Horodatage   : ${NOW_UTC}

      Le déploiement n'a PAS été effectué. L'environnement cible reste intact.

      Logs du job    : ${FAILED_JOB_URL}
      Pipeline       : ${PIPELINE_URL}
      Commit         : ${COMMIT_URL}

      Actions suggérées :
        • Reproduire localement : ./tests/quality.sh --fix
        • Ou Retry depuis l'UI GitLab si l'échec est transient

      -- KeyHome CI (notification automatique)
      TXT
      )

      {
        printf 'From: "%s" <%s>\r\n' "$MAIL_FROM_NAME" "$MAIL_FROM_ADDRESS"
        printf 'To: %s\r\n' "$NOTIFY_EMAIL_TO"
        printf 'Subject: %s\r\n' "$SUBJECT"
        printf 'X-Priority: 1\r\n'
        printf 'Importance: High\r\n'
        printf 'MIME-Version: 1.0\r\n'
        printf 'Content-Type: multipart/alternative; boundary="%s"\r\n' "$BOUNDARY"
        printf 'Date: %s\r\n' "$(date -u -R 2>/dev/null || date -u)"
        printf '\r\n'
        printf -- '--%s\r\n' "$BOUNDARY"
        printf 'Content-Type: text/plain; charset=UTF-8\r\n'
        printf 'Content-Transfer-Encoding: 8bit\r\n\r\n'
        printf '%s\r\n' "$TEXT_BODY"
        printf -- '--%s\r\n' "$BOUNDARY"
        printf 'Content-Type: text/html; charset=UTF-8\r\n'
        printf 'Content-Transfer-Encoding: 8bit\r\n\r\n'
        printf '%s\r\n' "$HTML_BODY"
        printf -- '--%s--\r\n' "$BOUNDARY"
      } > "$EMAIL_FILE"

      echo "📤 Envoi (échec) à ${NOTIFY_EMAIL_TO} via ${SMTP_URL}"
      curl --ssl-reqd --url "$SMTP_URL" \
        --mail-from "$MAIL_FROM_ADDRESS" \
        --mail-rcpt "$NOTIFY_EMAIL_TO" \
        --user "${MAIL_USERNAME}:${MAIL_PASSWORD}" \
        --upload-file "$EMAIL_FILE" \
        --silent --show-error --fail

      rm -f "$EMAIL_FILE"
      echo "✅ Notification d'échec envoyée."
  when: on_failure
  rules:
    - if: $CI_COMMIT_BRANCH

# --- ETAPE 5b : TEST DE RESTORE BACKUP (scheduled, weekly) ───────────────────
#
# Vérifie que les dumps `db-backup-local` sont restaurables. À programmer
# dans GitLab → CI/CD → Schedules :
#   - Description: "Weekly Postgres restore test"
#   - Interval pattern: 0 5 * * 1  (lundi 05h UTC)
#   - Variables: RUN_RESTORE_TEST=true
#
# Le job lit le dernier dump dans le volume `keyhome-db-backups`, le restore
# dans un Postgres jetable, et vérifie que les tables critiques ont des lignes.
# Si échec → l'email_failure existant prend le relais via le stage `notify`.
restore_test:
  stage: smoke_test
  needs: []
  timeout: 20 minutes
  rules:
    - if: $RUN_RESTORE_TEST == "true"
  script:
    - |
      set -eu
      echo "🔍 Backup restore verification"

      # 1° Identifier le volume contenant les dumps locaux (préfixe keyhome ou keyhome-prod).
      VOLUME=$(docker volume ls --format '{{.Name}}' | grep -E '_keyhome-db-backups$' | head -1)
      if [ -z "$VOLUME" ]; then
        echo "❌ Aucun volume de backup trouvé (keyhome-db-backups). Le sidecar db-backup-local est-il actif ?"
        exit 1
      fi
      echo "📦 Volume: $VOLUME"

      # 2° Sélectionner le dump le plus récent dans /backups/last/.
      LATEST_DUMP=$(docker run --rm -v "$VOLUME:/backups:ro" alpine sh -c \
        "ls -t /backups/last/*.sql.gz 2>/dev/null | head -1")
      if [ -z "$LATEST_DUMP" ]; then
        echo "❌ Aucun dump trouvé dans /backups/last/. Vérifier que db-backup-local tourne."
        docker run --rm -v "$VOLUME:/backups:ro" alpine ls -la /backups/ /backups/last/ 2>/dev/null || true
        exit 1
      fi
      echo "📄 Dump cible: $LATEST_DUMP"

      # 3° Spin-up un Postgres jetable.
      RESTORE_NET="restore-net-$CI_JOB_ID"
      RESTORE_DB="restore-db-$CI_JOB_ID"
      docker network create "$RESTORE_NET"
      docker run -d --name "$RESTORE_DB" --network "$RESTORE_NET" \
        -e POSTGRES_DB=restore_test \
        -e POSTGRES_USER=restore \
        -e POSTGRES_PASSWORD=restore_pwd \
        -v "$VOLUME:/backups:ro" \
        postgis/postgis:15-3.3-alpine

      # Attendre Postgres prêt
      for i in $(seq 1 30); do
        docker exec "$RESTORE_DB" pg_isready -U restore -h 127.0.0.1 && break
        [ "$i" = "30" ] && echo "❌ Postgres jetable n'a pas démarré" && exit 1
        sleep 2
      done

      # 4° Restore.
      echo "⏳ Restoring dump..."
      docker exec "$RESTORE_DB" sh -c \
        "gunzip -c $LATEST_DUMP | psql -U restore -d restore_test -v ON_ERROR_STOP=1 -q" \
        > /tmp/restore.log 2>&1 \
        || (echo "❌ pg_restore failed:" && tail -50 /tmp/restore.log && exit 1)
      echo "✅ Dump restauré sans erreur"

      # 5° Sanity checks : tables critiques doivent exister + avoir des lignes.
      check_table() {
        local table="$1"
        local min_rows="${2:-1}"
        local count
        count=$(docker exec "$RESTORE_DB" psql -U restore -d restore_test -tAc \
          "SELECT COUNT(*) FROM $table;" 2>/dev/null || echo "0")
        if [ "$count" -lt "$min_rows" ]; then
          echo "❌ Table $table : $count lignes (attendu ≥ $min_rows)"
          return 1
        fi
        echo "  ✓ $table : $count lignes"
      }

      echo "🔬 Sanity checks :"
      check_table users 1
      check_table ads 1
      check_table cities 1
      check_table ad_types 1

      echo "✅ Restore test passed."
  after_script:
    - docker rm -f "restore-db-$CI_JOB_ID" 2>/dev/null || true
    - docker network rm "restore-net-$CI_JOB_ID" 2>/dev/null || true

# --- ETAPE 6 : NETTOYAGE INTELLIGENT ---
cleanup:
  stage: cleanup
  script:
    - |
      echo "🧹 Starting cleanup..."

      # 1. La CI image ($CI_IMAGE) est intentionnellement conservée —
      #    elle sert de cache --cache-from pour le prochain pipeline sur cette branche.
      #    Seules les images dangling (non taguées) sont supprimées ci-dessous.

      # 2. Nettoyer les images dangling (sans tag)
      DANGLING=$(docker images -f "dangling=true" -q 2>/dev/null | wc -l | tr -d ' ')
      if [ "$DANGLING" -gt 0 ]; then
        docker rmi $(docker images -f "dangling=true" -q) 2>/dev/null || true
        echo "  ✓ Removed $DANGLING dangling images"
      fi

      # 3. Nettoyer les containers arrêtés depuis plus de 1h
      STOPPED=$(docker ps -a -f "status=exited" --format '{{.ID}}' 2>/dev/null | wc -l | tr -d ' ')
      if [ "$STOPPED" -gt 0 ]; then
        docker container prune -f --filter "until=1h" 2>/dev/null
        echo "  ✓ Cleaned stopped containers"
      fi

      # 4. Nettoyer les networks orphelins (sauf ceux en cours d'utilisation)
      docker network prune -f --filter "until=1h" 2>/dev/null || true
      echo "  ✓ Cleaned unused networks"

      # 5. Nettoyer les volumes orphelins (attention: pas les données!)
      # docker volume prune -f --filter "label!=keep" 2>/dev/null || true

      # 6. Nettoyer le build cache Docker (garde 10GB)
      docker builder prune -f --keep-storage=10GB 2>/dev/null || true
      echo "  ✓ Cleaned build cache (keeping 10GB)"

      # 7. Rapport final
      echo ""
      echo "📊 Disk usage after cleanup:"
      docker system df 2>/dev/null || true
  when: always
  rules:
    - if: $CI_COMMIT_BRANCH
