name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "preprod" ]
  pull_request:
    branches: [ "main", "develop", "preprod" ]

jobs:
  # -----------------------------------------------------------------------------
  # JOB 1: CI (Continuous Integration) - Run Tests
  # -----------------------------------------------------------------------------
  test:
    name: Run Tests (Pest)
    runs-on: ubuntu-latest

    services:
      # PostgreSQL with PostGIS is required for geometry tests
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis for caching tests
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, bcmath, zip, gd, redis
        coverage: none

    - name: Copy .env.testing
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Security Audit (CVE check)
      run: composer audit --format=plain

    - name: Code Style (Pint)
      run: vendor/bin/pint --test

    - name: Static Analysis (PHPStan)
      run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

    - name: Generate Key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Run Migrations (Testing DB)
      # Force use of service DB connection details
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: testing
        DB_USERNAME: postgres
        DB_PASSWORD: password
      run: php artisan migrate --force

    - name: Execute Tests (Pest)
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: testing
        DB_USERNAME: postgres
        DB_PASSWORD: password
        CACHE_DRIVER: redis
        REDIS_HOST: 127.0.0.1
        MAIL_MAILER: array
        RESEND_KEY: ''
      run: php artisan test

  # -----------------------------------------------------------------------------
  # JOB 1b: Frontend CI — TypeScript + Unit Tests + Lint
  # -----------------------------------------------------------------------------
  frontend-test:
    name: Frontend Tests (TypeScript + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keyhome-frontend-next

    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: keyhome-frontend-next/pnpm-lock.yaml

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    # Block CI on any CRITICAL production dependency advisory (HIGH stays
    # informational — the @sentry/webpack build-time chain ships HIGHs that
    # are not part of the runtime bundle).
    - name: Audit production dependencies (block on CRITICAL)
      run: pnpm audit --prod --audit-level=critical

    - name: TypeScript Check
      run: pnpm exec tsc --noEmit

    - name: Lint
      run: pnpm lint

    - name: Unit Tests (Vitest)
      run: pnpm test

    - name: Build for Lighthouse
      run: pnpm build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
        SKIP_ENV_VALIDATION: 1
      continue-on-error: true

    - name: Lighthouse CI (SEO + Core Web Vitals)
      run: npx @lhci/cli@0.14.x autorun
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      continue-on-error: true

  # -----------------------------------------------------------------------------
  # JOB 2: CD (Continuous Deployment) - Deploy to VPS
  # -----------------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    needs: [test, frontend-test] # Wait for both backend and frontend tests
    if: github.ref == 'refs/heads/main' # Only deploy on main branch
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: SSH Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd ${{ secrets.PROJECT_PATH }}
          bash deploy.sh

    - name: Smoke Test (Health Check)
      run: |
        sleep 30
        curl -f https://${{ secrets.APP_DOMAIN }}/api/health || exit 1
