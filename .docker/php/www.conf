[www]
user = www-data
group = www-data

listen = 9000
listen.backlog = -1

; Dynamic process manager — scales workers between min_spare and max_children.
; Formula for max_children: available_RAM / avg_php_process_RAM (≈ 40-60 MB each).
; VPS 12 GB RAM, ~6 GB available → 20 workers safe. Adjust up if RAM allows.
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 8
pm.max_spawn_rate = 32
pm.process_idle_timeout = 10s
pm.max_requests = 500

; FPM status page (used by health checks and monitoring)
pm.status_path = /fpm-status

; Slow-log: dump backtrace for requests taking > 10 s
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s

; Kill workers that hang for > 60 s (safety net for runaway requests)
request_terminate_timeout = 60s

; Log worker stdout/stderr to the Docker log stream
catch_workers_output = yes
decorate_workers_output = no

; Keep env vars available to PHP (Laravel reads them at boot)
clear_env = no

; Restrict FPM to PHP files only
security.limit_extensions = .php .phar
