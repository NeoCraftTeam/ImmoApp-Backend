[opcache]
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.revalidate_freq=0
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.fast_shutdown=1

; PHP 8.4 JIT — tracing mode gives the best throughput for Laravel/Livewire workloads.
; jit_buffer_size is carved out of opcache.memory_consumption, so the effective
; OPcache memory is 256 - 128 = 128 MB (still ample for a typical Laravel app).
opcache.jit=tracing
opcache.jit_buffer_size=128M
