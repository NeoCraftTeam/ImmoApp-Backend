# ── PHP-FPM upstream ─────────────────────────────────────────────────────────
# Docker DNS round-robins across all `app` replicas when scaled with
# `docker compose up --scale app=N`. The resolver forces DNS re-lookup
# every 10 s so new containers are picked up without an Nginx reload.
upstream php_fpm {
    least_conn;
    server app:9000;
    keepalive 32;
}

server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    # Docker DNS resolver — forces re-lookup of upstream IPs on TTL expiry
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Total body size: regular ads (10 × 20 MiB) + tour scenes (20 × 30 MiB) + overhead
    client_max_body_size 700M;

    # --- Security Headers (SEC-004) ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # HSTS — uncomment when TLS is terminated at this level (skip if behind Traefik with its own HSTS)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── FastCGI cache: public listing endpoints (no auth) ────────────────────
    # Cache is bypassed ($skip_cache=1) when:
    #   • Authorization header is present (Bearer token → authenticated user)
    #   • Session/XSRF cookie is present  (SPA cookie auth)
    #   • Request is not GET
    # The maps $fcgi_skip_auth / $fcgi_skip_cookie are declared in fastcgi-cache.conf.

    location ~ ^/api/v1/(ads|cities|ad-types)(/|$) {
        set $skip_cache 0;
        if ($request_method != GET)  { set $skip_cache 1; }
        if ($fcgi_skip_auth  = 1)    { set $skip_cache 1; }
        if ($fcgi_skip_cookie = 1)   { set $skip_cache 1; }

        try_files $uri /index.php?$query_string;

        fastcgi_pass  php_fpm;
        fastcgi_index index.php;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_buffers     64 16k;
        fastcgi_buffer_size 128k;
        fastcgi_read_timeout    30;
        fastcgi_connect_timeout 10;
        fastcgi_send_timeout    30;

        fastcgi_cache          keyhome_fcgi;
        fastcgi_cache_valid    200 5m;
        fastcgi_cache_valid    404 1m;
        fastcgi_cache_bypass   $skip_cache;
        fastcgi_no_cache       $skip_cache;
        fastcgi_cache_lock     on;
        fastcgi_cache_lock_timeout 3s;
        fastcgi_cache_use_stale error timeout updating http_500 http_503;

        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── All other PHP requests (no cache) ────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass  php_fpm; 
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffers 64 16k;
        fastcgi_buffer_size 128k;
        fastcgi_read_timeout 600;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 600;
    }

    # --- Storage: serve files but BLOCK PHP execution (SEC-003) ---
    location /storage/ {
        alias /var/www/storage/app/public/;
        try_files $uri =404;

        location ~* \.php$ {
            deny all;
            return 403;
        }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}
