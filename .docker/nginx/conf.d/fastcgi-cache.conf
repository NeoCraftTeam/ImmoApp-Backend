# ============================================================
# FastCGI response cache — KeyHome public API
# Included inside http{} via /etc/nginx/conf.d/*.conf
# ============================================================

fastcgi_cache_path /var/cache/nginx/fcgi
    levels=1:2
    keys_zone=keyhome_fcgi:20m
    max_size=512m
    inactive=5m
    use_temp_path=off;

fastcgi_cache_key "$scheme$request_method$host$request_uri";

# ---------------------------------------------------------------------------
# $fcgi_skip_auth — 1 when request carries a Bearer token (authenticated user)
# ---------------------------------------------------------------------------
map $http_authorization $fcgi_skip_auth {
    default 0;
    "~^.+"  1;
}

# ---------------------------------------------------------------------------
# $fcgi_skip_cookie — 1 when request carries a Laravel session or XSRF cookie
# ---------------------------------------------------------------------------
map $http_cookie $fcgi_skip_cookie {
    default 0;
    "~laravel_session|XSRF-TOKEN" 1;
}
