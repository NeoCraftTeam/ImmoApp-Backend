server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ── Logs de tous les containers Docker ──────────────────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: status
            values: [running]
    relabel_configs:
      # Nom du container → label "container"
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      # Image → label "image"
      - source_labels: [__meta_docker_container_image]
        target_label: image
      # Compose service name → label "service"
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      # job = "docker"
      - replacement: docker
        target_label: job
      # Chemin du log file
      - source_labels: [__meta_docker_container_id]
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/$1-json.log

    pipeline_stages:
      # Ignorer les logs trop anciens (évite les 400 "timestamp too old" de Loki)
      - drop:
          older_than: 168h
          drop_counter_reason: log_too_old
      # Parser le JSON du log Docker
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      # Utiliser le champ "log" comme ligne de log
      - output:
          source: output
      # Extraire le niveau de log Laravel (INFO, ERROR, WARNING, DEBUG)
      - regex:
          expression: '(?P<level>INFO|ERROR|WARNING|DEBUG|CRITICAL|ALERT|EMERGENCY|NOTICE)'
          source: output
      - labels:
          level:
          stream:
