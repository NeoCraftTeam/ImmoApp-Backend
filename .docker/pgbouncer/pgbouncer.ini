[databases]
; Routes all connections to the primary DB container.
; The read-replica (db-replica) is handled at the Laravel level (DB_HOST_READ).
* = host=db port=5432

[pgbouncer]
listen_addr         = 0.0.0.0
listen_port         = 5432

; transaction mode: connection returned to pool after each transaction.
; Ideal for Laravel (Eloquent does not use prepared statements across connections).
; NOTE: if you use DB::listen(), advisory locks, or NOTIFY/LISTEN, switch to session mode.
pool_mode           = transaction

auth_type           = scram-sha-256
auth_file           = /etc/pgbouncer/userlist.txt

; ── Pool limits ──────────────────────────────────────────────────────────────
max_client_conn     = 500
default_pool_size   = 25
reserve_pool_size   = 10
reserve_pool_timeout = 3

; ── Connection lifecycle ─────────────────────────────────────────────────────
server_idle_timeout = 600
server_lifetime     = 3600
client_idle_timeout = 0

; ── Compatibility ────────────────────────────────────────────────────────────
; Postgres 14+ sends extra_float_digits=1 on startup — PgBouncer would
; reject it in transaction mode without this setting.
ignore_startup_parameters = extra_float_digits

; ── Logging (reduce noise in production) ─────────────────────────────────────
log_connections     = 0
log_disconnections  = 0
log_pooler_errors   = 1
